<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pink teacup on a cream saucer, with two soft wisps of steam. Saucer bottom at y 37.6 (sits on a desk top).
       Cup: pink fill / shade / outline from the palette. Saucer: cream. No text. -->

  <!-- contact shadow on the sage desk -->
  <ellipse cx="19" cy="37.4" rx="15.6" ry="1.8" fill="#44795A" opacity=".14"/>

  <!-- steam: a white wisp with a faint cream edge so it reads on the pale wall -->
  <path d="M15 13.6C12.8 11.4 16.4 9.4 14.6 6.8C13.8 5.6 14.1 4.4 15 3.4" stroke="#F3D9DF" stroke-width="3"/>
  <path d="M15 13.6C12.8 11.4 16.4 9.4 14.6 6.8C13.8 5.6 14.1 4.4 15 3.4" stroke="#FFFFFF" stroke-width="1.8"/>
  <path d="M21.6 13C20 11.2 23 9.4 21.6 7.4" stroke="#F3D9DF" stroke-width="2.8"/>
  <path d="M21.6 13C20 11.2 23 9.4 21.6 7.4" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- saucer: rim ellipse over a thin underside band -->
  <path d="M3.6 33.8C3.6 35.9 10.5 37.6 19 37.6C27.5 37.6 34.4 35.9 34.4 33.8V34.4C34.4 36.4 27.5 38.1 19 38.1C10.5 38.1 3.6 36.4 3.6 34.4Z" fill="#F3E6D0"/>
  <ellipse cx="19" cy="33.8" rx="15.4" ry="3.3" fill="#FFF7EA"/>
  <path d="M8.6 32.6C10.8 31.9 14 31.5 16.8 31.4" stroke="#FFFFFF" stroke-width="1.1"/>
  <path d="M3.6 33.8C3.6 32 10.5 30.5 19 30.5C27.5 30.5 34.4 32 34.4 33.8V34.4C34.4 36.4 27.5 38.1 19 38.1C10.5 38.1 3.6 36.4 3.6 34.4Z" stroke="#D9C6A5" stroke-width="1.3"/>

  <!-- handle: an outlined loop on the right -->
  <path d="M28.6 19.4C34 18.2 35.4 25.6 29.4 27.2" stroke="#D97F97" stroke-width="4"/>
  <path d="M28.6 19.4C34 18.2 35.4 25.6 29.4 27.2" stroke="#F4B4C2" stroke-width="1.6"/>

  <!-- cup body -->
  <path d="M7.8 17.2C7.8 26.6 12.4 33.4 19 33.4C25.6 33.4 30.2 26.6 30.2 17.2Z" fill="#F4B4C2"/>
  <!-- turned-away side -->
  <path d="M25.8 18C26 25.4 24.2 30.4 20.6 33.2C26 32.6 30 26.4 30.2 18Z" fill="#EC9DB0"/>
  <!-- cream band near the foot, and a highlight on the lit side -->
  <path d="M11.4 28.2C15.2 29.4 22.8 29.4 26.6 28.2" stroke="#FFF7EA" stroke-width="1.5"/>
  <path d="M10.6 20.6C10.9 23.2 11.7 25.4 12.8 26.8" stroke="#FBD0D9" stroke-width="1.5"/>
  <path d="M7.8 17.2C7.8 26.6 12.4 33.4 19 33.4C25.6 33.4 30.2 26.6 30.2 17.2" stroke="#D97F97" stroke-width="1.4"/>

  <!-- rim and tea -->
  <ellipse cx="19" cy="17.2" rx="11.2" ry="3" fill="#FBD0D9"/>
  <ellipse cx="19" cy="17.5" rx="9.2" ry="2" fill="#C99368"/>
  <path d="M12.6 17.5C14.8 16.6 17.8 16.4 20.2 16.5" stroke="#DDB08A" stroke-width="1"/>
  <ellipse cx="19" cy="17.2" rx="11.2" ry="3" stroke="#D97F97" stroke-width="1.4"/>
</svg>
