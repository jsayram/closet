<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 74 96" width="74" height="96" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small framed picture hung on a wire from a nail: a soft sunny landscape on a cream mat in a wood frame.
       Frame x 4..70, y 18..92 (66 x 74), wood band 6 wide with mitred corners. Mat x 10..64, y 24..86.
       Picture window x 16..58, y 30..80. Wood: #E7BC6E / #D9A650 / #B98632, highlight #F3D391. -->
  <defs>
    <linearGradient id="ap-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6E6F7"/>
      <stop offset="1" stop-color="#EEF4FB"/>
    </linearGradient>
    <clipPath id="ap-win"><rect x="16" y="30" width="42" height="50"/></clipPath>
  </defs>

  <!-- wire and nail -->
  <path d="M11 21L37 6L63 21" stroke="#B98632" stroke-width="1"/>
  <circle cx="37" cy="5.6" r="2.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.1"/>

  <!-- frame -->
  <rect x="4" y="18" width="66" height="74" rx="2" fill="#E7BC6E"/>
  <!-- shade on the right and bottom bands -->
  <path d="M70 18.8V90A2 2 0 0 1 68 92H4.8L10 86H64V24Z" fill="#D9A650"/>
  <!-- mitre joints -->
  <path d="M5 19l5 5M69 19l-5 5M5 91l5-5M69 91l-5-5" stroke="#C99540" stroke-width=".8"/>
  <!-- light along the top and left -->
  <path d="M7 88V21H67" stroke="#F3D391" stroke-width="1.2"/>
  <rect x="4" y="18" width="66" height="74" rx="2" stroke="#B98632" stroke-width="1.3"/>

  <!-- mat -->
  <rect x="10" y="24" width="54" height="62" fill="#FFF7EA"/>
  <path d="M10 24H64V26.4H12.4V86H10Z" fill="#F3E6D0"/>
  <rect x="10" y="24" width="54" height="62" stroke="#B98632" stroke-width="1.1"/>

  <!-- picture -->
  <rect x="16" y="30" width="42" height="50" fill="url(#ap-sky)"/>
  <g clip-path="url(#ap-win)">
    <!-- sun -->
    <circle cx="47.5" cy="41" r="5.2" fill="#FBE9A6" stroke="#DDBB4E" stroke-width="1"/>
    <path d="M45.2 38.8a3.2 3.2 0 0 1 2.4-1.2" stroke="#FFFBEB" stroke-width="1"/>
    <!-- small cloud -->
    <path d="M20.5 46.2H31.4A2.6 2.6 0 0 0 30.6 41.2A3.6 3.6 0 0 0 24.4 40.4A3 3 0 0 0 20.5 46.2Z" fill="#FFFFFF" stroke="#C9DAEE" stroke-width=".9"/>
    <!-- far hill and its tree -->
    <path d="M14 66C24 56.4 36 55.6 60 61.4V82H14Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1"/>
    <path d="M26.4 60.2V55.6" stroke="#B98632" stroke-width="1.2"/>
    <circle cx="26.4" cy="53" r="3.8" fill="#77AE84" stroke="#44795A" stroke-width="1"/>
    <path d="M24.6 51.6a2 2 0 0 1 1.6-1.4" stroke="#93C29D" stroke-width=".9"/>
    <!-- near hill -->
    <path d="M14 73.2C27 66 42 66.4 60 74.6V82H14Z" fill="#93C29D" stroke="#5C9670" stroke-width="1"/>
    <path d="M20 72.2C25 70.2 30 69.4 34.6 69.4" stroke="#B7D5B1" stroke-width="1"/>
  </g>
  <rect x="16" y="30" width="42" height="50" stroke="#D9C6A5" stroke-width=".9"/>
</svg>
