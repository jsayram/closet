<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 28" width="180" height="28" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Short gold wall rail for the iPad Closet detail panel: a rod on two round wall brackets, with ball finials.
       Rod centre y 12, x 12..168 (a hanger hook at 60/120 of its garment box sits on it). Brackets at x 30 and 150.
       Wood: fill #E7BC6E, shade #D9A650, outline #B98632, highlight #F6DC9C. The rod's soft shadow falls on the wall below it. -->
  <!-- shadow on the wall -->
  <path d="M16 17.4 H164" stroke="#E9B9C5" stroke-width="2.2" opacity=".55"/>
  <!-- wall brackets: a round plate with a short arm up to the rod -->
  <g>
    <circle cx="30" cy="16" r="6.2" fill="#D9A650" stroke="#B98632" stroke-width="1.3"/>
    <circle cx="30" cy="16" r="3.4" fill="#E7BC6E"/>
    <circle cx="29" cy="15" r="1.1" fill="#F6DC9C"/>
    <circle cx="150" cy="16" r="6.2" fill="#D9A650" stroke="#B98632" stroke-width="1.3"/>
    <circle cx="150" cy="16" r="3.4" fill="#E7BC6E"/>
    <circle cx="149" cy="15" r="1.1" fill="#F6DC9C"/>
  </g>
  <!-- rod -->
  <path d="M12 12 H168" stroke="#B98632" stroke-width="5.4"/>
  <path d="M12 12 H168" stroke="#E7BC6E" stroke-width="3.1"/>
  <path d="M15 11 H165" stroke="#F6DC9C" stroke-width="1"/>
  <!-- ball finials -->
  <circle cx="8.4" cy="12" r="4.2" fill="#E7BC6E" stroke="#B98632" stroke-width="1.3"/>
  <path d="M8.4 16.2 A4.2 4.2 0 0 0 12.6 12" stroke="#D9A650" stroke-width="1.4" opacity=".9"/>
  <circle cx="7.2" cy="10.8" r="1.2" fill="#F6DC9C"/>
  <circle cx="171.6" cy="12" r="4.2" fill="#E7BC6E" stroke="#B98632" stroke-width="1.3"/>
  <path d="M171.6 16.2 A4.2 4.2 0 0 0 175.8 12" stroke="#D9A650" stroke-width="1.4" opacity=".9"/>
  <circle cx="170.4" cy="10.8" r="1.2" fill="#F6DC9C"/>
</svg>
