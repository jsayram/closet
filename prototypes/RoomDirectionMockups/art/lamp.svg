<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 64" width="44" height="64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small table lamp: cream-butter dome shade, slim gold stem, thin flat round base with a small step. Base bottom at y 62.4. -->
  <defs>
    <clipPath id="lamp-dome">
      <path d="M3 22.4C3 10.4 11 3.6 22 3.6C33 3.6 41 10.4 41 22.4C41 23.6 40.2 24.4 39 24.4H5C3.8 24.4 3 23.6 3 22.4Z"/>
    </clipPath>
  </defs>

  <!-- base: a thin flat disc, seen a little from above, so its top is an ellipse and its edge a narrow band -->
  <path d="M7.5 60.4C7.5 59.3 14 58.5 22 58.5C30 58.5 36.5 59.3 36.5 60.4V60.9C36.5 61.7 35.8 62.4 35 62.4H9C8.2 62.4 7.5 61.7 7.5 60.9Z" fill="#E7BC6E"/>
  <path d="M7.5 60.4C7.5 61.3 14 62 22 62C30 62 36.5 61.3 36.5 60.4V60.9C36.5 61.7 35.8 62.4 35 62.4H9C8.2 62.4 7.5 61.7 7.5 60.9Z" fill="#D9A650"/>
  <path d="M11.4 59.9C13.8 59.4 16.6 59.2 19 59.1" stroke="#F8E3B0" stroke-width=".9"/>
  <path d="M7.5 60.4C7.5 59.3 14 58.5 22 58.5C30 58.5 36.5 59.3 36.5 60.4V60.9C36.5 61.7 35.8 62.4 35 62.4H9C8.2 62.4 7.5 61.7 7.5 60.9Z" stroke="#B98632" stroke-width="1.3"/>
  <!-- small step the stem rises from -->
  <path d="M16.2 58.6C16.2 57.6 18.8 56.9 22 56.9C25.2 56.9 27.8 57.6 27.8 58.6V59C27.8 59.5 27.4 59.8 26.9 59.8H17.1C16.6 59.8 16.2 59.5 16.2 59Z" fill="#E7BC6E"/>
  <path d="M22 56.9C25.2 56.9 27.8 57.6 27.8 58.6V59C27.8 59.5 27.4 59.8 26.9 59.8H22Z" fill="#D9A650"/>
  <path d="M16.2 58.6C16.2 57.6 18.8 56.9 22 56.9C25.2 56.9 27.8 57.6 27.8 58.6V59C27.8 59.5 27.4 59.8 26.9 59.8H17.1C16.6 59.8 16.2 59.5 16.2 59Z" stroke="#B98632" stroke-width="1.25"/>

  <!-- stem -->
  <rect x="20.2" y="25.4" width="3.6" height="31.8" fill="#E7BC6E"/>
  <rect x="22.3" y="25.4" width="1.5" height="31.8" fill="#D9A650"/>
  <path d="M21.1 27.6V55" stroke="#F8E3B0" stroke-width=".7"/>
  <path d="M20.2 26.4V57.2M23.8 26.4V57.2" stroke="#B98632" stroke-width="1.25"/>
  <!-- collar where the stem meets the shade -->
  <rect x="18.2" y="24" width="7.6" height="3.4" rx="1.4" fill="#D9A650" stroke="#B98632" stroke-width="1.25"/>

  <!-- finial -->
  <rect x="19.8" y="1" width="4.4" height="4.6" rx="2.2" fill="#E7BC6E" stroke="#B98632" stroke-width="1.25"/>
  <circle cx="21.2" cy="2.6" r=".7" fill="#F8E3B0"/>

  <!-- shade -->
  <path d="M3 22.4C3 10.4 11 3.6 22 3.6C33 3.6 41 10.4 41 22.4C41 23.6 40.2 24.4 39 24.4H5C3.8 24.4 3 23.6 3 22.4Z" fill="#FDF1C6"/>
  <g clip-path="url(#lamp-dome)">
    <!-- turned-away side, and the rim band at the bottom -->
    <path d="M29 2C37.6 7 41.6 16 42.4 27H32.6C33.8 17.4 32.8 9 27 2Z" fill="#F8E4A4"/>
    <rect x="2" y="20.8" width="40" height="4.4" fill="#F3D97C"/>
    <!-- light catching the upper left -->
    <path d="M8.2 18C9 11.8 13 7.8 18.2 6.4" stroke="#FFFBEA" stroke-width="2.2"/>
  </g>
  <path d="M3.6 20.8H40.4" stroke="#E6C85C" stroke-width=".8"/>
  <path d="M3 22.4C3 10.4 11 3.6 22 3.6C33 3.6 41 10.4 41 22.4C41 23.6 40.2 24.4 39 24.4H5C3.8 24.4 3 23.6 3 22.4Z" stroke="#DDBB4E" stroke-width="1.4"/>
</svg>
