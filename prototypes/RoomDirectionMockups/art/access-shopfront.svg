<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 283" width="390" height="283" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Boutique shop front for the paywall sheet header, full sheet width, seen straight on.
       Facade (wardrobe blue #A9CBEF / #8FB8E6 / #6C9AD0, highlight #C6DDF5) x 60..332, y 27..267, cream cornice y 12..27.6.
       Striped pink and cream awning (pink #F4B4C2 / #EC9DB0 / #D97F97, cream #FFF7EA / #F3E6D0 / #D9C6A5):
       rod y 33, slope 33..47, valance 47..51 with scallops down to about y 56.
       Display window: glass x 87..215, y 48..249 (the awning covers it to about y 56). Display floor y 237..249, pink round
       rug centred (151, 243.4): stand the avatar's soles there. Two short wood rails at y 64 (x 90..130 and 172..212),
       one piece on each, centred at x 110 and 192. The page lays the avatar, the garments and a glass sheen over the glass.
       Sage door x 236..296 with an arched glass panel and a hanging plaque. Pink potted plant by the door, pot foot (348, 278).
       Pavement y 267..279, closed by a curb line at y 279.6 and a curb face to y 283 (floor tones).
       The top left (x 0..56, y 0..60) is open sky for the sheet's close button, and the top centre above the cornice
       (y 0..12) stays clear for the grabber. -->
  <defs>
    <linearGradient id="asf-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2EDF9"/>
      <stop offset="1" stop-color="#F8EEF3"/>
