<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 614 248" width="614" height="248" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- iPad Closet: the same blue armoire as the phone Closet (closet-armoire.svg), widened to three bays.
       Same crown cornice, the same two doors swung open to the sides, the same plinth with bracket feet, the same blues.
       The frieze is deeper than on the phone so it can carry the three section plates.
       Drawn in art coordinates y 76..324 (viewBox 0 76 614 248). On ipad-closet.html it is placed at left 270, top 98,
       614 x 248, so page x = art x + 270 and page y = art y + 22. All numbers below are art coordinates.
       Contract:
         Cornice y 79..100.2, x 30..584. Body front x 40..574, y 100..302.
         Frieze (flat label zone for HTML plates): x 46..568, y 103..150, plain blue. Bead lines at y 151.6 and 153.4.
         Opening x 52..562, y 156..294. Back wall x 60..554.
         Bays: 52..217, 225..389, 397..562 (centres 134.5, 307, 479.5). Partitions x 217..225 and 389..397, y 156..250.
         Rails, centre y 165: x 57.5..213.6, 228.4..385.6, 400.4..556.5.
         Divider shelf front edge y 250..256, full width. Shoe tier below it: back edge y 272 (x 60..554), front edge
           y 294 (x 52..562); shoes rest with their soles on about y 290.
         Doors: hinge edges x 40 and 574, free edges x 7 and 607, y 100..307.
         Plinth and bracket feet to y 320; floor contact shadow at y 320. Ids are prefixed ia-. -->
  <defs>
    <clipPath id="ia-open"><rect x="52" y="156" width="510" height="138"/></clipPath>
    <linearGradient id="ia-top" x1="0" y1="162" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C78B2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4C78B2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ia-under" x1="0" y1="256" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C78B2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4C78B2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ia-floor" x1="0" y1="272" x2="0" y2="294" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93BAE6"/>
      <stop offset="1" stop-color="#B2D0F1"/>
    </linearGradient>

    <!-- left door, inner face, swung open past square (the phone door, shortened to this body). -->
    <g id="ia-door">
      <path d="M40 106 L7 100 L7 307 L40 300 Z" fill="#A9CBEF"/>
      <path d="M40 106 L35.5 105.2 V301 L40 300 Z" fill="#8FB8E6"/>
      <!-- recessed panels: outline, dark top and free-side bevel, light bottom and hinge-side bevel -->
      <path d="M11.5 111 L33 114 V183.3 L11.5 182.8 Z" fill="#B6D3F2" stroke="#6C9AD0" stroke-width="1.3"/>
      <path d="M12.2 111.7 L32.4 114.5 V116.6 L14.4 114.1 V182.4 H12.2 Z" fill="#8FB8E6"/>
      <path d="M14.6 180.7 L30.6 181 V116.8" stroke="#DCEBFB" stroke-width="1.2"/>
      <path d="M11.5 193.2 L33 193.3 V292.4 L11.5 295.9 Z" fill="#B6D3F2" stroke="#6C9AD0" stroke-width="1.3"/>
      <path d="M12.2 193.8 H32.4 V196 H14.4 V295.1 L12.2 295.4 Z" fill="#8FB8E6"/>
      <path d="M14.6 293.4 L30.6 290.4 V196.4" stroke="#DCEBFB" stroke-width="1.2"/>
      <path d="M9.4 103.4 V303.9" stroke="#CFE2F8" stroke-width="1.2"/>
      <path d="M40 106 L7 100 L7 307 L40 300 Z" stroke="#6C9AD0" stroke-width="1.5"/>
      <!-- door thickness at the free edge -->
      <path d="M7 100 L4.2 100.9 V306.2 L7 307 Z" fill="#8FB8E6" stroke="#6C9AD0" stroke-width="1.2"/>
      <!-- gold hinges -->
      <rect x="38.3" y="120" width="3.6" height="10" rx="1.2" fill="#E7BC6E" stroke="#B98632" stroke-width="1"/>
      <rect x="38.3" y="276" width="3.6" height="10" rx="1.2" fill="#E7BC6E" stroke="#B98632" stroke-width="1"/>
    </g>

    <!-- one gold rail with round end brackets, from x 0 to x L (set per use with the bracket at L) -->
    <g id="ia-bracket">
      <circle cx="0" cy="0" r="3.3" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>
      <circle cx="-.8" cy="-.9" r="1" fill="#F6DC9C"/>
    </g>

    <!-- partition between two bays, drawn at x 0 (front face x 0..8) -->
    <g id="ia-part">
      <path d="M-1.6 162 L0 156 V250 L-1.6 246.6 Z" fill="#8FB8E6"/>
      <rect x="0" y="156" width="8" height="94" fill="#A9CBEF" stroke="#6C9AD0" stroke-width="1.3"/>
      <path d="M2 158 V248" stroke="#CFE2F8" stroke-width="1"/>
    </g>
  </defs>

  <!-- floor contact shadow -->
  <ellipse cx="307" cy="319.6" rx="288" ry="3.4" fill="#8A5A48" opacity=".13"/>

  <!-- body front: frieze, stiles and base rail -->
  <rect x="40" y="100" width="534" height="202" fill="#A9CBEF" stroke="#6C9AD0" stroke-width="1.5"/>
  <rect x="40.75" y="100.75" width="532.5" height="1.6" fill="#8FB8E6"/>

  <!-- frieze band: a thin light bead just above the opening -->
  <path d="M46 151.6 H568" stroke="#CFE2F8" stroke-width="1.2"/>
  <path d="M46 153.4 H568" stroke="#8FB8E6" stroke-width="1"/>

  <!-- ============ interior ============ -->
  <g clip-path="url(#ia-open)">
    <rect x="52" y="156" width="510" height="138" fill="#7FA8D8"/>
    <!-- back boards -->
    <path d="M112 162 V246.6 M165 162 V246.6 M280 162 V246.6 M335 162 V246.6 M450 162 V246.6 M503 162 V246.6 M165 256 V272 M307 256 V272 M450 256 V272"
          stroke="#6F9BD0" stroke-width="1" opacity=".6"/>
    <!-- inner side walls in perspective: the left one in shade, the right one catching light -->
    <path d="M52 156 L60 162 V272 L52 294 Z" fill="#6590C6"/>
    <path d="M562 156 L554 162 V272 L562 294 Z" fill="#8FB8E6"/>
    <path d="M60 162 V272 M554 162 V272" stroke="#557FB6" stroke-width="1" opacity=".8"/>
    <!-- underside of the top -->
    <path d="M52 156 H562 L554 162 H60 Z" fill="#6590C6"/>
    <!-- soft shadow under the top -->
    <rect x="52" y="162" width="510" height="28" fill="url(#ia-top)"/>
    <!-- each partition's shadow on the next bay's back wall -->
    <path d="M225 162 H233 V246.6 H225 Z M397 162 H405 V246.6 H397 Z" fill="#6590C6" opacity=".45"/>
    <!-- rail shadows on the back wall -->
    <path d="M64 171.5 H212 M232 171.5 H384 M404 171.5 H552" stroke="#6590C6" stroke-width="2.4" opacity=".7"/>
    <!-- shade under the divider shelf, in the shoe tier -->
    <rect x="52" y="256" width="510" height="16" fill="url(#ia-under)"/>
  </g>

  <!-- divider shelf top face (below eye level, so it shows) -->
  <path d="M52 250 H562 L554 246.6 H60 Z" fill="#CFE2F8" stroke="#6C9AD0" stroke-width="1.1"/>

  <!-- partitions -->
  <use href="#ia-part" x="217"/>
  <use href="#ia-part" x="389"/>

  <!-- gold rails with round brackets, one per bay -->
  <g>
    <path d="M58 165 H213 M229 165 H385 M401 165 H556" stroke="#B98632" stroke-width="5.4"/>
    <path d="M58 165 H213 M229 165 H385 M401 165 H556" stroke="#E7BC6E" stroke-width="3.1"/>
    <path d="M61 164 H210 M232 164 H382 M404 164 H553" stroke="#F6DC9C" stroke-width="1"/>
    <use href="#ia-bracket" x="57.5" y="165"/>
    <use href="#ia-bracket" x="213.6" y="165"/>
    <use href="#ia-bracket" x="228.4" y="165"/>
    <use href="#ia-bracket" x="385.6" y="165"/>
    <use href="#ia-bracket" x="400.4" y="165"/>
    <use href="#ia-bracket" x="556.5" y="165"/>
  </g>

  <!-- divider shelf front edge -->
  <rect x="52" y="250" width="510" height="6" rx="1" fill="#A9CBEF" stroke="#6C9AD0" stroke-width="1.3"/>
  <path d="M54 251.7 H560" stroke="#CFE2F8" stroke-width="1"/>

  <!-- interior floor (the shoe ledge): a deep top face, lighter than the back wall, darkest where it meets the wall,
       with board seams that carry on from the back boards -->
  <path d="M52 294 H562 L554 272 H60 Z" fill="url(#ia-floor)"/>
  <path d="M60 273.6 H554" stroke="#7FA8D8" stroke-width="2" opacity=".55"/>
  <path d="M165 272.6 L162 293.4 M307 272.6 V293.4 M450 272.6 L453 293.4" stroke="#8FB8E6" stroke-width="1"/>
  <path d="M60 272 H554" stroke="#557FB6" stroke-width="1.1"/>
  <path d="M57 291.4 H557" stroke="#C7DEF6" stroke-width="1" opacity=".9"/>

  <!-- opening edge and its light bevel -->
  <rect x="52" y="156" width="510" height="138" stroke="#557FB6" stroke-width="1.5"/>
  <path d="M50.4 157.5 V292.5 M53.5 295.6 H560.5" stroke="#CFE2F8" stroke-width="1" opacity=".9"/>
  <path d="M563.6 157.5 V292.5" stroke="#8FB8E6" stroke-width="1"/>
  <!-- light on the left stile, shade on the right stile -->
  <path d="M42.6 104 V299" stroke="#CFE2F8" stroke-width="1.3"/>
  <path d="M571.4 104 V299" stroke="#8FB8E6" stroke-width="1.3"/>
  <!-- base rail line -->
  <path d="M42 298 H572" stroke="#8FB8E6" stroke-width="1"/>

  <!-- plinth: a ledge and a skirt with bracket feet -->
  <path d="M40 308 V320 H58 C59.5 316.2 63.5 315.4 70 315.4 H544 C550.5 315.4 554.5 316.2 556 320 H574 V308 Z" fill="#A9CBEF" stroke="#6C9AD0" stroke-width="1.4"/>
  <path d="M42 309.4 V318.8 M572 309.4 V318.8" stroke="#8FB8E6" stroke-width="1.2"/>
  <rect x="36" y="302" width="542" height="6.4" rx="1.4" fill="#A9CBEF" stroke="#6C9AD0" stroke-width="1.5"/>
  <path d="M39 304 H575" stroke="#CFE2F8" stroke-width="1"/>
  <rect x="40.8" y="308.9" width="532.4" height="2" fill="#8FB8E6"/>

  <!-- crown cornice: top face, cap board, cove, bead (the phone profile, widened) -->
  <g transform="translate(0 28)">
    <path d="M30 54 H584 L579 51 H35 Z" fill="#CFE2F8" stroke="#6C9AD0" stroke-width="1.3"/>
    <rect x="30" y="54" width="554" height="6" rx="1.3" fill="#A9CBEF" stroke="#6C9AD0" stroke-width="1.5"/>
    <path d="M33 55.8 H581" stroke="#CFE2F8" stroke-width="1"/>
    <path d="M34 60 C34 64.6 36.6 67.6 40.4 68 H573.6 C577.4 67.6 580 64.6 580 60 Z" fill="#A9CBEF" stroke="#6C9AD0" stroke-width="1.4"/>
    <path d="M35.6 64 C36.6 66.4 38.4 67.4 40.6 67.4 H573.4 C575.6 67.4 577.4 66.4 578.4 64 Z" fill="#8FB8E6"/>
    <rect x="37" y="68" width="540" height="4.2" rx="2.1" fill="#CFE2F8" stroke="#6C9AD0" stroke-width="1.4"/>
  </g>

  <!-- doors -->
  <use href="#ia-door"/>
  <use href="#ia-door" transform="matrix(-1 0 0 1 614 0)"/>
</svg>
