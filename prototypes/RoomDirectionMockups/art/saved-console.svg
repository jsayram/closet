<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 70" width="150" height="70" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Low console for the end of the Saved Looks wall: a cream cabinet with two drawers, a wood top and short tapered wood legs.
       Top board x 4..146: top face y 6..9 (things stand at y 8), front edge y 9..15. Body x 10..140, y 15..53.
       Leg feet on the floor at y 66. Contact shadow y 62.5..69.5. No label zone; nothing sits on it but a plant.
       Wood: fill #E7BC6E, shade #D9A650, outline #B98632, highlight #F3D391. Cream: fill #FFF7EA, shade #F3E6D0, outline #D9C6A5. -->

  <!-- contact shadow -->
  <ellipse cx="75" cy="66" rx="66" ry="3.5" fill="#7A4636" opacity=".12"/>

  <!-- back legs, glimpsed between the front ones -->
  <path d="M30 52H35L34.4 62H31Z" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>
  <path d="M115 52H120L119 62H115.6Z" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>

  <!-- front legs, splayed a little -->
  <path d="M14.5 52H22.5L20.6 66H16.8Z" fill="#E7BC6E"/>
  <path d="M19.4 52H22.5L20.6 66H18.9Z" fill="#D9A650"/>
  <path d="M14.5 52H22.5L20.6 66H16.8Z" stroke="#B98632" stroke-width="1.4"/>
  <path d="M127.5 52H135.5L133.2 66H129.4Z" fill="#E7BC6E"/>
  <path d="M132.4 52H135.5L133.2 66H131.4Z" fill="#D9A650"/>
  <path d="M127.5 52H135.5L133.2 66H129.4Z" stroke="#B98632" stroke-width="1.4"/>

  <!-- body -->
  <path d="M10 15H140V50.5A2.5 2.5 0 0 1 137.5 53H12.5A2.5 2.5 0 0 1 10 50.5Z" fill="#FFF7EA"/>
  <!-- side shade and underside -->
  <path d="M134.5 15H140V50.5A2.5 2.5 0 0 1 137.5 53H134.5Z" fill="#F3E6D0"/>
  <path d="M10 47H140V50.5A2.5 2.5 0 0 1 137.5 53H12.5A2.5 2.5 0 0 1 10 50.5Z" fill="#F3E6D0"/>
  <path d="M10 47H140" stroke="#E6D6BC" stroke-width="1"/>
  <!-- highlight down the lit edge -->
  <path d="M12.6 17.5V44.5" stroke="#FFFDF8" stroke-width="1.6"/>
  <path d="M10 15H140V50.5A2.5 2.5 0 0 1 137.5 53H12.5A2.5 2.5 0 0 1 10 50.5Z" stroke="#D9C6A5" stroke-width="1.4"/>

  <!-- drawers -->
  <rect x="17" y="20" width="55" height="22.5" rx="3" fill="#FFF7EA" stroke="#D9C6A5" stroke-width="1.3"/>
  <rect x="78" y="20" width="55" height="22.5" rx="3" fill="#FFF7EA" stroke="#D9C6A5" stroke-width="1.3"/>
  <path d="M21 39.6H68M82 39.6H129" stroke="#F3E6D0" stroke-width="1.6"/>
  <path d="M20.2 22.6H68.8M81.2 22.6H129.8" stroke="#FFFDF8" stroke-width="1.2"/>
  <!-- knobs -->
  <circle cx="44.5" cy="31.2" r="2.7" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
  <circle cx="43.7" cy="30.4" r=".8" fill="#F3D391"/>
  <circle cx="105.5" cy="31.2" r="2.7" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
  <circle cx="104.7" cy="30.4" r=".8" fill="#F3D391"/>

  <!-- wood top: front edge, top face, highlight, grain -->
  <path d="M4 9H146V13A2 2 0 0 1 144 15H6A2 2 0 0 1 4 13Z" fill="#E7BC6E"/>
  <path d="M4 12.6H146V13A2 2 0 0 1 144 15H6A2 2 0 0 1 4 13Z" fill="#D9A650"/>
  <path d="M6.5 6H143.5A2.5 2.5 0 0 1 146 8.5V9H4V8.5A2.5 2.5 0 0 1 6.5 6Z" fill="#F3D391"/>
  <path d="M20 11.2H34M58 11H66M92 11.3H108M124 11.1H131" stroke="#D9A650" stroke-width=".8"/>
  <path d="M6.5 6H143.5A2.5 2.5 0 0 1 146 8.5V13A2 2 0 0 1 144 15H6A2 2 0 0 1 4 13V8.5A2.5 2.5 0 0 1 6.5 6Z" stroke="#B98632" stroke-width="1.4"/>
  <path d="M4.4 9H145.6" stroke="#B98632" stroke-width="1"/>
</svg>
