  <path d="M51 19.4Q58.6 26.4 66.4 19.4" stroke="#131115" stroke-width=".9" opacity=".6"/>
  <path d="M42.6 26.6C44.4 23 47.4 20.6 50.6 19.6" stroke="#4E4853" stroke-width="1.4"/>
