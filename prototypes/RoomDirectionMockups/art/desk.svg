<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 134" width="196" height="134">
  <!-- Sage writing desk, seen a little from above and from the left.
       Palette: fill #B7D5B1, shade #9FC49C, outline #7BA67D, highlight #CFE5C9. Knobs: wood #E7BC6E / #B98632.
       Label zone: the top drawer face x107-187, y20-56 (80 x 36) is flat and plain. An 80 x 36 .tag plate is laid
       exactly over it, leaving 5 units of pedestal frame showing left and right, like the reference.
       Desk top surface: the slab spans y2-11.6; objects standing on the desk sit with their base at about y4.
       Feet: front feet end at y132, the far-left leg ends at y128 (place the desk so y128 lands just below the floor line). -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- contact shadows on the floor -->
    <ellipse cx="144" cy="131.2" rx="50" ry="3" fill="#7A4636" opacity=".12"/>
    <ellipse cx="9" cy="131.6" rx="9" ry="2.4" fill="#7A4636" opacity=".12"/>
    <ellipse cx="22" cy="128.2" rx="6" ry="1.6" fill="#7A4636" opacity=".12"/>

    <!-- modesty panel at the back of the knee space -->
    <path d="M16,19 H97 V86 Q97,88.6 94.4,88.6 H18.6 Q16,88.6 16,86 Z" fill="#9FC49C" stroke="#7BA67D" stroke-width="1.25"/>
    <rect x="16.7" y="19.6" width="80" height="3.2" fill="#7BA67D" opacity=".28"/>
    <line x1="22" y1="85.6" x2="94" y2="85.6" stroke="#B7D5B1" stroke-width="1" opacity=".7"/>

    <!-- far-left leg, seen through the knee space -->
    <path d="M18.5,19 H25 V121 L24.4,127.4 Q21.75,129 19.1,127.4 L18.5,121 Z" fill="#9FC49C" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="20.6" y1="26" x2="20.6" y2="118" stroke="#B7D5B1" stroke-width="1" opacity=".7"/>

    <!-- apron rail across the knee space, tucked under the slab -->
    <path d="M10,11.6 H98 V19.6 H10 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <rect x="10.6" y="12.2" width="86.8" height="1.8" fill="#9FC49C"/>
    <line x1="13" y1="17.6" x2="96" y2="17.6" stroke="#CFE5C9" stroke-width="1" opacity=".9"/>

    <!-- front-left leg -->
    <path d="M3.6,11.6 H13.4 V112 L12.2,131.4 Q8.5,133.1 4.8,131.4 L3.6,112 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M10.2,12.4 H13.4 V112 L12.2,131.4 Q10.9,132.1 9.4,132.4 L10.2,112 Z" fill="#9FC49C"/>
    <line x1="6.2" y1="16" x2="6.2" y2="110" stroke="#CFE5C9" stroke-width="1.1" opacity=".8"/>

    <!-- pedestal carcass -->
    <path d="M96,11.6 H192 V121 Q192,124.5 188.5,124.5 H99.5 Q96,124.5 96,121 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <!-- side face toward the knee space -->
    <path d="M96,11.6 H102 V124.5 H99.5 Q96,124.5 96,121 Z" fill="#9FC49C"/>
    <line x1="102" y1="12" x2="102" y2="124" stroke="#7BA67D" stroke-width="1" opacity=".55"/>
    <!-- shadow the slab overhang casts on the pedestal front -->
    <rect x="102.6" y="12.2" width="88.8" height="1.8" fill="#9FC49C"/>
    <!-- plinth recess under the bottom drawer -->
    <rect x="102.6" y="120.6" width="88.8" height="3.2" fill="#9FC49C"/>

    <!-- top drawer: kept flat, a label plate goes here (x107-187, y20-56) -->
    <rect x="107" y="20" width="80" height="36" rx="2.5" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>

    <!-- middle drawer -->
    <rect x="107" y="60" width="80" height="27" rx="2.5" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="110.5" y1="61.9" x2="183.5" y2="61.9" stroke="#CFE5C9" stroke-width="1.1" opacity=".95"/>
    <line x1="110.5" y1="85.2" x2="183.5" y2="85.2" stroke="#9FC49C" stroke-width="1.3"/>
    <rect x="111.5" y="64.5" width="71" height="18" rx="1.5" fill="none" stroke="#7BA67D" stroke-width="1" opacity=".5"/>
    <ellipse cx="147.6" cy="74.5" rx="4" ry="3.6" fill="#7BA67D" opacity=".35"/>
    <circle cx="147" cy="73.5" r="3.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
    <circle cx="145.8" cy="72.3" r="1.05" fill="#FAE7B8"/>

    <!-- bottom drawer -->
    <rect x="107" y="91" width="80" height="27" rx="2.5" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="110.5" y1="92.9" x2="183.5" y2="92.9" stroke="#CFE5C9" stroke-width="1.1" opacity=".95"/>
    <line x1="110.5" y1="116.2" x2="183.5" y2="116.2" stroke="#9FC49C" stroke-width="1.3"/>
    <rect x="111.5" y="95.5" width="71" height="18" rx="1.5" fill="none" stroke="#7BA67D" stroke-width="1" opacity=".5"/>
    <ellipse cx="147.6" cy="105.5" rx="4" ry="3.6" fill="#7BA67D" opacity=".35"/>
    <circle cx="147" cy="104.5" r="3.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
    <circle cx="145.8" cy="103.3" r="1.05" fill="#FAE7B8"/>

    <!-- short tapered feet under the pedestal -->
    <path d="M98.5,124 H109 L108,131.4 Q103.75,133.1 99.5,131.4 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M106,124 H109 L108,131.4 Q106.7,132.2 105.3,132.5 L105.8,124.4 Z" fill="#9FC49C"/>
    <path d="M179.5,124 H190 L189,131.4 Q184.75,133.1 180.5,131.4 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M187,124 H190 L189,131.4 Q187.7,132.2 186.3,132.5 L186.8,124.4 Z" fill="#9FC49C"/>

    <!-- top slab: front edge (slightly darker), then the lit top face. 9.6 units in all. -->
    <path d="M1,6 H195 V9.6 Q195,11.6 193,11.6 H3 Q1,11.6 1,9.6 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <line x1="4" y1="7.7" x2="192" y2="7.7" stroke="#CFE5C9" stroke-width="1" opacity=".9"/>
    <path d="M5,2 H191 Q193.4,2 194,4 L195,6 H1 L2,4 Q2.6,2 5,2 Z" fill="#CFE5C9" stroke="#7BA67D" stroke-width="1.4"/>
  </g>
</svg>
