<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 172" width="104" height="172" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hard-shell spinner suitcase (sage), seen from the front with its right side showing. Ids are prefixed scs-.
       Tones: fill #B7D5B1, shade #9FC49C, outline #7BA67D, highlight #D3E8CE; handles and wheels #86B087 / #5E8A61.
       Shell x 2..102, y 16..156; the side band is x 94..102. Front face centre x 48.
       Label zone (flat, plain): x 4..92, y 30..78. An 88 x 48 luggage-tag plate sits at x 4, y 30.
       The tag strap loops round the grip and comes straight down into the plate's top centre (48, 30);
       the plate draws the last bit of strap down to its eyelet, so the strap reads as threaded through it. Wheels rest on y 168.6; contact shadow to y 172. -->
  <defs><clipPath id="scs-shell"><path d="M15 16H89Q102 16 102 29V143Q102 156 89 156H15Q2 156 2 143V29Q2 16 15 16Z"/></clipPath></defs>
  <ellipse cx="52" cy="168.8" rx="51" ry="2.6" fill="#7A4636" opacity=".13"/>
  <!-- rear wheels -->
  <g transform="translate(21 152.8) scale(0.82)"><path d="M-6.5 0H6.5L5.2 4.6H-5.2Z" fill="#86B087" stroke="#5E8A61" stroke-width="1.3"/><rect x="-4.2" y="3.4" width="8.4" height="9.2" rx="3.6" fill="#86B087" stroke="#5E8A61" stroke-width="1.3"/><path d="M1.6 5.6V10.4" stroke="#5E8A61" stroke-width="1" opacity=".8"/><circle cx="-.6" cy="8" r="1.3" fill="#D3E8CE"/></g><g transform="translate(96.5 152.8) scale(0.82)"><path d="M-6.5 0H6.5L5.2 4.6H-5.2Z" fill="#86B087" stroke="#5E8A61" stroke-width="1.3"/><rect x="-4.2" y="3.4" width="8.4" height="9.2" rx="3.6" fill="#86B087" stroke="#5E8A61" stroke-width="1.3"/><path d="M1.6 5.6V10.4" stroke="#5E8A61" stroke-width="1" opacity=".8"/><circle cx="-.6" cy="8" r="1.3" fill="#D3E8CE"/></g>
  <!-- trolley handle, retracted: two posts and a rounded grip -->
  <path d="M24.6 18V9.6H29.4V18M66.6 18V9.6H71.4V18" fill="#9FC49C" stroke="#7BA67D" stroke-width="1.3"/>
  <rect x="21" y="2" width="54" height="8.4" rx="4.2" fill="#86B087" stroke="#5E8A61" stroke-width="1.4"/>
  <path d="M25 4.6H70" stroke="#D3E8CE" stroke-width="1.2" opacity=".75"/>
  <!-- shell -->
  <path d="M15 16H89Q102 16 102 29V143Q102 156 89 156H15Q2 156 2 143V29Q2 16 15 16Z" fill="#B7D5B1"/>
