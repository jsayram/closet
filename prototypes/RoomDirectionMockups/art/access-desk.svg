<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 128" width="358" height="128">
  <!-- Long sage writing desk for the Styling access room, seen straight on (a front elevation, like the kit desk).
       Palette as desk.svg: fill #B7D5B1, shade #9FC49C, outline #7BA67D, highlight #CFE5C9. Knobs: wood #E7BC6E / #B98632.
       Top slab y 2..11.6 (lit top face 2..6): things standing on the desk put their base at y 4.
       Left: one tapered leg (x 10..21) and a shallow pencil drawer in the apron. Right: a pedestal of three drawers (x 236..352).
       Feet end at y 124.6, with flat contact shadows; place the desk so the feet land a few px below the floor line. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- contact shadows on the floor -->
    <ellipse cx="15.5" cy="124" rx="10" ry="2.4" fill="#7A4636" opacity=".12"/>
    <ellipse cx="294" cy="124" rx="62" ry="3" fill="#7A4636" opacity=".12"/>

    <!-- the knee space is open: the wall shows through under the apron -->

    <!-- front-left leg -->
    <path d="M10,11.6 H21 V112 L19.6,123.4 Q15.5,125.1 11.4,123.4 L10,112 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M17.4,12.4 H21 V112 L19.6,123.4 Q18.3,124.2 16.7,124.5 L17.4,112 Z" fill="#9FC49C"/>
    <line x1="12.8" y1="16" x2="12.8" y2="110" stroke="#CFE5C9" stroke-width="1.1" opacity=".85"/>

    <!-- apron rail across the knee space, with a shallow pencil drawer -->
    <path d="M21,11.6 H236 V34.6 H21 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <rect x="21.6" y="12.2" width="213.8" height="1.8" fill="#9FC49C"/>
    <line x1="24" y1="32.4" x2="233" y2="32.4" stroke="#9FC49C" stroke-width="1.2"/>
    <rect x="72" y="16.4" width="114" height="13.6" rx="2.2" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="75" y1="18.2" x2="183" y2="18.2" stroke="#CFE5C9" stroke-width="1.05" opacity=".95"/>
    <line x1="75" y1="28.3" x2="183" y2="28.3" stroke="#9FC49C" stroke-width="1.2"/>
    <!-- a small wood pull, wider than it is tall, as on a pencil drawer -->
    <ellipse cx="129.6" cy="24.2" rx="6.4" ry="2.6" fill="#7BA67D" opacity=".3"/>
    <rect x="123" y="20.6" width="12" height="4.4" rx="2.2" fill="#E7BC6E" stroke="#B98632" stroke-width="1.15"/>
    <line x1="125.4" y1="21.9" x2="129.4" y2="21.9" stroke="#FAE7B8" stroke-width=".9"/>

    <!-- pedestal carcass -->
    <path d="M236,11.6 H352 V112.6 Q352,116 348.6,116 H239.4 Q236,116 236,112.6 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <!-- shadow the slab overhang casts on the pedestal front, and the plinth recess -->
    <rect x="236.7" y="12.2" width="114.6" height="1.8" fill="#9FC49C"/>
    <rect x="237" y="110.4" width="114" height="3.2" fill="#9FC49C"/>
    <line x1="238.8" y1="16" x2="238.8" y2="108" stroke="#CFE5C9" stroke-width="1" opacity=".8"/>

    <!-- top drawer -->
    <rect x="243" y="18" width="102" height="26" rx="2.5" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="246.5" y1="19.9" x2="341.5" y2="19.9" stroke="#CFE5C9" stroke-width="1.1" opacity=".95"/>
    <line x1="246.5" y1="42.2" x2="341.5" y2="42.2" stroke="#9FC49C" stroke-width="1.3"/>
    <rect x="247.5" y="22.5" width="93" height="17" rx="1.5" fill="none" stroke="#7BA67D" stroke-width="1" opacity=".5"/>
    <ellipse cx="294.6" cy="32" rx="4" ry="3.6" fill="#7BA67D" opacity=".35"/>
    <circle cx="294" cy="31" r="3.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
    <circle cx="292.8" cy="29.8" r="1.05" fill="#FAE7B8"/>

    <!-- middle drawer -->
    <rect x="243" y="48" width="102" height="28" rx="2.5" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="246.5" y1="49.9" x2="341.5" y2="49.9" stroke="#CFE5C9" stroke-width="1.1" opacity=".95"/>
    <line x1="246.5" y1="74.2" x2="341.5" y2="74.2" stroke="#9FC49C" stroke-width="1.3"/>
    <rect x="247.5" y="52.5" width="93" height="19" rx="1.5" fill="none" stroke="#7BA67D" stroke-width="1" opacity=".5"/>
    <ellipse cx="294.6" cy="63" rx="4" ry="3.6" fill="#7BA67D" opacity=".35"/>
    <circle cx="294" cy="62" r="3.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
    <circle cx="292.8" cy="60.8" r="1.05" fill="#FAE7B8"/>

    <!-- bottom drawer -->
    <rect x="243" y="80" width="102" height="28" rx="2.5" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.25"/>
    <line x1="246.5" y1="81.9" x2="341.5" y2="81.9" stroke="#CFE5C9" stroke-width="1.1" opacity=".95"/>
    <line x1="246.5" y1="106.2" x2="341.5" y2="106.2" stroke="#9FC49C" stroke-width="1.3"/>
    <rect x="247.5" y="84.5" width="93" height="19" rx="1.5" fill="none" stroke="#7BA67D" stroke-width="1" opacity=".5"/>
    <ellipse cx="294.6" cy="95" rx="4" ry="3.6" fill="#7BA67D" opacity=".35"/>
    <circle cx="294" cy="94" r="3.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
    <circle cx="292.8" cy="92.8" r="1.05" fill="#FAE7B8"/>

    <!-- short tapered feet under the pedestal -->
    <path d="M239,115.6 H250 L249,123.4 Q244.5,125.1 240,123.4 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M247,115.6 H250 L249,123.4 Q247.7,124.2 246.3,124.5 L246.8,116 Z" fill="#9FC49C"/>
    <path d="M338,115.6 H349 L348,123.4 Q343.5,125.1 339,123.4 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <path d="M346,115.6 H349 L348,123.4 Q346.7,124.2 345.3,124.5 L345.8,116 Z" fill="#9FC49C"/>

    <!-- top slab: front edge (slightly darker), then the lit top face. 9.6 units in all. -->
    <path d="M1,6 H357 V9.6 Q357,11.6 355,11.6 H3 Q1,11.6 1,9.6 Z" fill="#B7D5B1" stroke="#7BA67D" stroke-width="1.4"/>
    <line x1="4" y1="7.7" x2="354" y2="7.7" stroke="#CFE5C9" stroke-width="1" opacity=".9"/>
    <path d="M5,2 H353 Q355.4,2 356,4 L357,6 H1 L2,4 Q2.6,2 5,2 Z" fill="#CFE5C9" stroke="#7BA67D" stroke-width="1.4"/>
  </g>
</svg>
