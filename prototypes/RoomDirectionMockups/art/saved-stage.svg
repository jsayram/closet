<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 58" width="150" height="58" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A low round display stage for a saved look, seen a little from above: a wood drum with panel grooves, a wider
       stepped foot, and a pink upholstered top with a stitched edge.
       Top rim: centre (75, 17), rx 68, ry 12. Cushion: centre (75, 16.4), rx 61, ry 9.8. Feet stand with the soles at y 18.
       Drum front bottom y 45. Foot ledge and plinth to y 52 at the front. Contact shadow y 47..57.
       Wood: fill #E7BC6E, shade #D9A650, outline #B98632, highlight #F3D391.
       Pink: fill #F4B4C2, shade #EC9DB0, outline #D97F97, highlight #F9CDD5. -->
  <defs>
    <clipPath id="ss-drum"><path d="M7 17V33A68 12 0 0 0 143 33V17Z"/></clipPath>
    <clipPath id="ss-foot"><path d="M4 36V39.5A71 12.5 0 0 0 146 39.5V36Z"/></clipPath>
  </defs>

  <!-- contact shadow on the floor -->
  <ellipse cx="75" cy="51.8" rx="74" ry="5.4" fill="#7A4636" opacity=".12"/>

  <!-- stepped foot -->
  <ellipse cx="75" cy="36" rx="71" ry="12.5" fill="#F0CB80"/>
  <path d="M4 36V39.5A71 12.5 0 0 0 146 39.5V36Z" fill="#D9A650"/>
  <g clip-path="url(#ss-foot)"><path d="M112 0H150V58H104C110 52 112.6 46 112 40Z" fill="#CF9A45"/></g>
  <path d="M4 36V39.5A71 12.5 0 0 0 146 39.5V36" stroke="#B98632" stroke-width="1.3"/>
  <ellipse cx="75" cy="36" rx="71" ry="12.5" stroke="#C4913A" stroke-width="1.1"/>

  <!-- drum -->
  <path d="M7 17V33A68 12 0 0 0 143 33V17Z" fill="#E7BC6E"/>
  <g clip-path="url(#ss-drum)">
    <path d="M108 0H150V58H100C106.4 50 108.6 42 108 30Z" fill="#D9A650"/>
    <!-- panel grooves, each with a lit edge on its left -->
    <path d="M16.1 24.6V39.4M41 28.9V43.6M75 30.4V45M109 28.9V43.6M133.9 24.6V39.4" stroke="#C9963F" stroke-width=".9"/>
    <path d="M17.4 25.2V39.2M42.3 29.4V43.4M76.3 30.8V44.6" stroke="#F3D391" stroke-width=".8"/>
    <path d="M110.3 29.4V43.4M135.2 25.2V39.2" stroke="#E2B462" stroke-width=".8"/>
  </g>
  <path d="M7 17V33A68 12 0 0 0 143 33V17" stroke="#B98632" stroke-width="1.4"/>

  <!-- top rim -->
  <ellipse cx="75" cy="17" rx="68" ry="12" fill="#F3D391"/>
  <ellipse cx="75" cy="17" rx="68" ry="12" stroke="#B98632" stroke-width="1.4"/>

  <!-- cushion -->
  <ellipse cx="75" cy="16.4" rx="61" ry="9.8" fill="#F4B4C2"/>
  <path d="M14.6 17.6C18 23.2 43 26.2 75 26.2S132 23.2 135.4 17.6C132.6 21 109 23.8 75 23.8S17.4 21 14.6 17.6Z" fill="#EC9DB0"/>
  <path d="M27 12.4C35 8.6 52 7.2 70 7.2" stroke="#F9CDD5" stroke-width="2.2"/>
  <ellipse cx="75" cy="16.2" rx="54" ry="7.6" stroke="#F9CDD5" stroke-width=".85" stroke-dasharray="2.6 2.6" opacity=".8"/>
  <ellipse cx="75" cy="16.4" rx="61" ry="9.8" stroke="#D97F97" stroke-width="1.25"/>
</svg>
