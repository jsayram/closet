<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 13" width="46" height="13" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The nude pointed flats (g-nude-flats) standing as a pair on a pink room floor, toes left, for the
       look card in Ask stylist. Same shoe outline as garments.js and home-flats.svg, drawn at 0.24 so one shoe
       is about 22 px long. Soles rest on y 11.4. Stroke widths are set so they land near 0.9 to 1 px.
       Tones from garments.js: fill #F1DCC6, shade #E2C8AC, highlight #F9ECDD, outline #B48F68,
       lining #C9A684 / #F6E6D2, sole #C8A27C. Contact shadow: the floor tone darkened, 13 percent.
       Ids are prefixed cf-. -->
  <defs>
    <path id="cf-upper" d="M1.6 31.6C3 27 12 22.6 22 19.6C28 17.8 33 17 38 17.2C40 22.4 46.5 25.8 56 25.8C68 25.8 80 21.2 86.5 13.2C88.2 10.4 90.6 8.6 92.4 9.8C94.6 11.6 95.2 16 95.2 20L94.8 31C94.8 33.2 93.2 34.2 90.6 34.2L8 34.2C4 34.2 1 33.6 1.6 31.6Z"/>
    <path id="cf-open" d="M38 17.2C46 10 68 4.5 84 5.8C88 6.1 91 7.4 92.4 9.8C90.6 8.6 88.2 10.4 86.5 13.2C80 21.2 68 25.8 56 25.8C46.5 25.8 40 22.4 38 17.2Z"/>
    <clipPath id="cf-clip-u"><use href="#cf-upper"/></clipPath>
    <clipPath id="cf-clip-o"><use href="#cf-open"/></clipPath>
    <g id="cf-shoe">
      <!-- sole -->
      <path d="M2.4 33.6H94.6V35.4Q94.6 36.8 93 36.8H7C4 36.8 2 35.8 2.4 33.6Z" fill="#C8A27C" stroke="#B48F68" stroke-width="3.5"/>
      <!-- opening with its lining -->
      <use href="#cf-open" fill="#C9A684"/>
      <g clip-path="url(#cf-clip-o)"><path d="M44 22C56 13.5 76 10.5 90 12.5L90 30L44 30Z" fill="#F6E6D2"/></g>
      <use href="#cf-open" stroke="#B48F68" stroke-width="3.35"/>
      <!-- upper: fill, lower shade band, one highlight -->
      <use href="#cf-upper" fill="#F1DCC6"/>
      <g clip-path="url(#cf-clip-u)">
        <path d="M0 27H100V40H0Z" fill="#E2C8AC"/>
        <path d="M10 26.6C15 23.4 20 21.4 26 20.2" stroke="#F9ECDD" stroke-width="3.8"/>
      </g>
      <use href="#cf-upper" stroke="#B48F68" stroke-width="4.2"/>
      <!-- bow at the throat -->
      <path d="M31.5 19.6c-3-5.5-9.5-5.5-9.5-1c0 4 6 4 9.5 1Z M31.5 19.6c3-5.5 9.5-5.5 9.5-1c0 4-6 4-9.5 1Z" fill="#F9ECDD" stroke="#B48F68" stroke-width="2.4"/>
      <circle cx="31.5" cy="19.6" r="2.6" fill="#F1DCC6" stroke="#B48F68" stroke-width="2.25"/>
    </g>
  </defs>

  <!-- contact shadow on the floor (floor shade darkened) -->
  <ellipse cx="22" cy="11.6" rx="21" ry="1.35" fill="#9C5E4C" opacity=".13"/>

  <!-- far shoe, set back and to the right; its toe tucks behind the near heel -->
  <use href="#cf-shoe" transform="translate(18.6 1.5) scale(.24)"/>
  <!-- near shoe -->
  <use href="#cf-shoe" transform="translate(1.4 2.6) scale(.24)"/>
</svg>
