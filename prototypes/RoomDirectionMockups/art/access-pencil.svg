<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 80" width="72" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A butter-yellow pencil lying on the close-up desk, its point toward the card and the rest running out of frame
       past the right screen edge, so it reads at the card's scale. Placed at page (318, 196).
       Point at (20, 62), body 14 units across, turned 42 degrees up to the right.
       Paint: butter #FBE9A6 / shade #F3D97C / highlight #FFF6CF / outline #DDBB4E. Bare wood: cream #FFF7EA /
       #F3E6D0 / #D9C6A5. Lead: #6B5563, outline #4D3B47. Contact shadow #44795A at 15 percent. -->
  <defs>
    <clipPath id="apc-body"><path d="M26 -7H140V7H26Q22 4.67 26 2.33Q22 0 26 -2.33Q22 -4.67 26 -7Z"/></clipPath>
  </defs>

  <!-- contact shadow on the desk -->
  <g transform="translate(22.6 65.4) rotate(-42)">
    <path d="M0 0L26 -6.4H140V7H26Z" fill="#44795A" opacity=".15"/>
  </g>

  <g transform="translate(20 62) rotate(-42)">
    <!-- sharpened wood -->
    <path d="M8 -2.15L26 -7V7L8 2.15Z" fill="#FFF7EA"/>
    <path d="M8 .6L26 1.4V7L8 2.15Z" fill="#F3E6D0"/>
    <path d="M8 -2.15L26 -7V7L8 2.15Z" stroke="#D9C6A5" stroke-width="1.2"/>
    <!-- lead -->
    <path d="M.6 0L8.4 -2.3V2.3Z" fill="#6B5563"/>
    <path d="M2.4 -.5L7.2 -1.6" stroke="#9A8592" stroke-width=".8"/>
    <path d="M.6 0L8.4 -2.3V2.3Z" stroke="#4D3B47" stroke-width="1.1"/>

    <!-- painted body with three facets and the scalloped edge where the paint meets the wood -->
    <path d="M26 -7H140V7H26Q22 4.67 26 2.33Q22 0 26 -2.33Q22 -4.67 26 -7Z" fill="#FBE9A6"/>
    <g clip-path="url(#apc-body)">
      <rect x="18" y="-8" width="124" height="5.6" fill="#FFF3C2"/>
      <rect x="18" y="2.4" width="124" height="6" fill="#F3D97C"/>
      <path d="M18 -2.4H142M18 2.4H142" stroke="#EDCF6C" stroke-width=".8"/>
      <path d="M31 -4.9H140" stroke="#FFFBEA" stroke-width="1.1"/>
    </g>
    <path d="M140 -7H26Q22 -4.67 26 -2.33Q22 0 26 2.33Q22 4.67 26 7H140" stroke="#DDBB4E" stroke-width="1.3"/>
  </g>
</svg>
