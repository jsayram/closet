<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 54" width="64" height="54" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A small parcel on the floor, for "expected arrival" after the store handoff (handoff.html). 1:1 at phone size.
