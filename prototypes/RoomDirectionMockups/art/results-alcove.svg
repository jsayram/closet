<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 456" width="216" height="456" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dressing-room alcove for the Style Me results and the swap sheet (one alcove for both screens; figure 100 wide,
       the same size as on home). An arched niche in the wall, lit lilac from inside, with a cream curtain on each side
       hanging from a gold rod and held back by a gold tieback, and a round pink rug in front. The arch and curtains are
       results-alcove-sm.svg's drawing at 0.9, with every outline kept at its 1:1 width (non-scaling strokes).
       Rod centre y 8.1 (x 6.3..209.7), ring tops y 3.1. Casing outer x 39.6..176.4, niche opening x 46.8..169.2, apex y 25.2.
       Back wall x 53.1..162.9 (inner apex y 35.1), floor junction y 381.6. Curtains x 1.8..54 and 162..214.2,
       tiebacks y 232..240, hems to y 397. Floor line (casing feet) y 398.7.
       Rug, drawn at 1:1: centre (108, 434), rx 96, ry 17, pile to y 453.6. A figure stands on the rug centre, x 108.
       Flat label zone: none needed; the niche field stays quiet so a figure reads on it. Ids are prefixed ra-. -->
  <defs>
    <radialGradient id="ra-glow" cx="120" cy="200" r="190" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 200) scale(1 1.25) translate(-120 -200)">
      <stop offset="0" stop-color="#FAF6FE"/>
      <stop offset=".5" stop-color="#EEE5FA"/>
      <stop offset="1" stop-color="#DCCCF2"/>
    </radialGradient>
    <linearGradient id="ra-floor" x1="0" y1="424" x2="0" y2="443" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4D7F1"/>
      <stop offset="1" stop-color="#EFE3EF"/>
    </linearGradient>
    <g id="ra-curtain">
      <ellipse cx="25" cy="443.6" rx="25" ry="2" fill="#8A5A48" opacity=".12"/>
      <!-- body: scalloped heading on the rod, inner edge sweeping out to the tieback, flaring back to the hem -->
      <path d="M4 14.5 C8 12 12 12 16 14.5 C20 12 24 12 28 14.5 C32 12 36 12 40 14.5 C44 12 48 12 52 14.5 C55 12.6 58 12.8 60 15
               C61 122 56 204 41.6 249.6 C40 253.2 38.2 256 37.5 258 L37.5 267 C38.4 269.6 40.4 272.8 42.2 276.4 C45.2 326 46.8 388 47 438.6
               C45.6 441.6 40 441.6 35.6 439 C31 441.8 25.4 441.8 21 439 C16.4 441.8 10.8 441.8 6.4 439 C4.6 440.2 3 440.2 2 439.4
               C2.6 380 6.2 306 6.6 276.4 C7.4 272.4 8.6 269.4 9.2 267 L9.2 258 C8.6 255.8 7.4 253 6.8 249.6 C6 180 4.8 84 4 14.5 Z" fill="#FFF7EA"/>
      <!-- fold shade: gathers above the tieback narrow into it, then fan out to the hem -->
      <path d="M14.6 15.2 C15.4 90 15.8 190 16.2 258 L19.2 258 C18.8 190 18 92 16.8 14.8 Z" fill="#F3E6D0"/>
      <path d="M26.6 15.2 C27 92 24.6 190 22.8 258 L25.6 258 C27.6 190 29.6 92 29 14.8 Z" fill="#F3E6D0"/>
      <path d="M38.6 15.2 C38.6 92 33 190 29.2 258 L32 258 C36.2 190 41.4 92 41 14.8 Z" fill="#F3E6D0"/>
      <path d="M50.4 15.4 C49.8 92 41.6 190 34.6 258 L36.4 258 C44.4 190 52.6 92 52.6 15 Z" fill="#F3E6D0"/>
      <path d="M15.4 267 C14.2 330 12.4 390 11.2 439.4 L14.4 440.2 C15.6 390 17.4 330 18.4 267 Z" fill="#F3E6D0"/>
      <path d="M24 267 C24.6 330 25.6 390 26.4 439.8 L29.4 439.6 C28.6 390 27.4 330 26.8 267 Z" fill="#F3E6D0"/>
      <path d="M31.2 267 C34.4 330 37.6 390 39.6 439.6 L42.4 440 C40.6 390 37.2 330 33.8 267 Z" fill="#F3E6D0"/>
      <!-- fold lines -->
      <path d="M16.8 16 C17.4 92 17.8 190 17.8 257" stroke="#D9C6A5" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".75"/>
      <path d="M28.6 16 C28.6 92 26.6 190 24.4 257" stroke="#D9C6A5" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".75"/>
      <path d="M40.6 16 C40.4 92 35 190 30.8 257" stroke="#D9C6A5" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".75"/>
      <path d="M17 268 C16 330 14.2 390 12.9 438.8" stroke="#D9C6A5" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".75"/>
      <path d="M25.4 268 C26 330 27 390 27.9 439" stroke="#D9C6A5" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".75"/>
      <path d="M32.6 268 C36 330 39.2 390 41 439" stroke="#D9C6A5" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".75"/>
      <!-- highlight down the inner edge, and the hem's turned-up shade -->
      <path d="M58.4 21 C59 118 54.4 200 41.2 245.4" stroke="#FFFEFB" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <path d="M41.8 280 C44.6 326 45.6 386 45.6 433" stroke="#FFFEFB" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <path d="M3.8 435.2 C6.4 437 9.4 437 11.6 435.6 C14.4 437.4 18.4 437.4 21.2 435.6 C24 437.4 28 437.4 30.8 435.6 C33.8 437.4 38 437.4 41 435.6 C42.6 436.8 44.6 436.8 45.6 435.6" stroke="#F3E6D0" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <!-- outline -->
      <path d="M4 14.5 C8 12 12 12 16 14.5 C20 12 24 12 28 14.5 C32 12 36 12 40 14.5 C44 12 48 12 52 14.5 C55 12.6 58 12.8 60 15
               C61 122 56 204 41.6 249.6 C40 253.2 38.2 256 37.5 258 L37.5 267 C38.4 269.6 40.4 272.8 42.2 276.4 C45.2 326 46.8 388 47 438.6
               C45.6 441.6 40 441.6 35.6 439 C31 441.8 25.4 441.8 21 439 C16.4 441.8 10.8 441.8 6.4 439 C4.6 440.2 3 440.2 2 439.4
               C2.6 380 6.2 306 6.6 276.4 C7.4 272.4 8.6 269.4 9.2 267 L9.2 258 C8.6 255.8 7.4 253 6.8 249.6 C6 180 4.8 84 4 14.5 Z" stroke="#D9C6A5" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <!-- gold tieback band around the gathered waist, with a small tassel on the inner side -->
      <path d="M7 257.6 C17 255.4 30 255.4 40.4 257.6 L40.4 267.4 C30 265.6 17 265.6 7 267.4 Z" fill="#E7BC6E"/>
      <path d="M8.4 265.6 C18 264 29.6 264 39 265.6" stroke="#D9A650" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <path d="M9 259.2 C18 257.6 29 257.6 38.6 259.2" stroke="#F6DC9C" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="M7 257.6 C17 255.4 30 255.4 40.4 257.6 L40.4 267.4 C30 265.6 17 265.6 7 267.4 Z" stroke="#B98632" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <path d="M40.6 266 C42.4 268.6 42.8 271 42.4 273" stroke="#B98632" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
      <circle cx="42.4" cy="274.4" r="2.1" fill="#E7BC6E" stroke="#B98632" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="M40.6 276.2 L39.6 287.4 C41 288.8 43.8 288.8 45.2 287.4 L44.2 276.2 Z" fill="#E7BC6E"/>
      <path d="M42.4 277.4 V286.6" stroke="#D9A650" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="M40.6 276.2 L39.6 287.4 C41 288.8 43.8 288.8 45.2 287.4 L44.2 276.2 Z" stroke="#B98632" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
      <!-- rings on the rod -->
      <rect x="3.4" y="3.4" width="2.8" height="9.6" rx="1.4" fill="#D9A650" stroke="#B98632" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <rect x="14.6" y="3.4" width="2.8" height="9.6" rx="1.4" fill="#D9A650" stroke="#B98632" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <rect x="26.6" y="3.4" width="2.8" height="9.6" rx="1.4" fill="#D9A650" stroke="#B98632" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <rect x="38.6" y="3.4" width="2.8" height="9.6" rx="1.4" fill="#D9A650" stroke="#B98632" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <rect x="50.6" y="3.4" width="2.8" height="9.6" rx="1.4" fill="#D9A650" stroke="#B98632" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </g>
  </defs>

  <g transform="scale(0.9)">

    <!-- ============ niche ============ -->
    <!-- depth band (the soffit and the two jambs), one tone deeper than the back wall -->
    <path d="M52 443 V96 A68 68 0 0 1 188 96 V443 Z" fill="#D3C1EF"/>
    <!-- back wall, lit from inside -->
    <path d="M59 424 V100 A61 61 0 0 1 181 100 V424 Z" fill="url(#ra-glow)"/>
    <!-- the soffit catches a little light along its lower edge -->
    <path d="M60.6 104 A59.4 59.4 0 0 1 179.4 104" stroke="#E6DAF8" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <!-- niche floor, in perspective from the back wall to the room's floor line -->
    <path d="M59 424 H181 L188 443 H52 Z" fill="url(#ra-floor)"/>
    <path d="M59 424 H181" stroke="#C3ABE6" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <path d="M59 424 L52 443 M181 424 L188 443" stroke="#C3ABE6" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="M59 424 V100 A61 61 0 0 1 181 100 V424" stroke="#C3ABE6" stroke-width="1.1" vector-effect="non-scaling-stroke"/>

    <!-- ============ cream casing around the arch ============ -->
    <path d="M44 443 V96 A76 76 0 0 1 196 96 V443 H188 V96 A68 68 0 0 0 52 96 V443 Z" fill="#FFF7EA"/>
    <!-- inner shade along the opening, highlight up the outer left -->
    <path d="M50.4 440 V96 A69.6 69.6 0 0 1 189.6 96 V440" stroke="#F3E6D0" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    <path d="M45.8 436 V96 A74.2 74.2 0 0 1 120 21.8" stroke="#FFFEFB" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
    <path d="M48 440 V96 A72 72 0 0 1 192 96 V440" stroke="#EADBC1" stroke-width=".7" vector-effect="non-scaling-stroke"/>
    <path d="M44 443 V96 A76 76 0 0 1 196 96 V443 H188 V96 A68 68 0 0 0 52 96 V443 Z" stroke="#D9C6A5" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <!-- keystone -->
    <path d="M113.4 16.6 H126.6 L124.6 31.4 H115.4 Z" fill="#FFF7EA"/>
    <path d="M115.6 18.8 H124.4" stroke="#FFFEFB" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="M116.6 29.4 H123.4" stroke="#F3E6D0" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <path d="M113.4 16.6 H126.6 L124.6 31.4 H115.4 Z" stroke="#D9C6A5" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
    <!-- plinth blocks where the casing meets the floor, with their contact shadows -->
    <ellipse cx="48.1" cy="443.8" rx="9" ry="1.6" fill="#8A5A48" opacity=".12"/>
    <ellipse cx="191.9" cy="443.8" rx="9" ry="1.6" fill="#8A5A48" opacity=".12"/>
    <rect x="41.6" y="418" width="13" height="25" rx="1.4" fill="#FFF7EA" stroke="#D9C6A5" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
    <rect x="185.4" y="418" width="13" height="25" rx="1.4" fill="#FFF7EA" stroke="#D9C6A5" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
    <path d="M43.6 421.6 H52.6 M187.4 421.6 H196.4" stroke="#F3E6D0" stroke-width="1.2" vector-effect="non-scaling-stroke"/>

    <!-- ============ rod ============ -->
    <path d="M7 9 H233" stroke="#B98632" stroke-width="5.6" vector-effect="non-scaling-stroke"/>
    <path d="M7 9 H233" stroke="#E7BC6E" stroke-width="3.2" vector-effect="non-scaling-stroke"/>
    <path d="M10 8.1 H230" stroke="#F6DC9C" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <circle cx="4.4" cy="9" r="4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <circle cx="3.4" cy="7.9" r="1.1" fill="#F6DC9C"/>
    <circle cx="235.6" cy="9" r="4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <circle cx="234.6" cy="7.9" r="1.1" fill="#F6DC9C"/>

    <!-- ============ curtains ============ -->
    <use href="#ra-curtain"/>
    <use href="#ra-curtain" transform="translate(240 0) scale(-1 1)"/>
  </g>

  <!-- ============ round rug in front (drawn at 1:1) ============ -->
  <ellipse cx="108" cy="436.6" rx="96" ry="17" fill="#E294A8"/>
  <ellipse cx="108" cy="434" rx="96" ry="17" fill="#EDA9B9" stroke="#E294A8" stroke-width="1.4"/>
  <ellipse cx="108" cy="434" rx="88.5" ry="13.6" fill="#F3BCC8" stroke="#E294A8" stroke-width="1" stroke-opacity=".5"/>
  <ellipse cx="101" cy="430.8" rx="60" ry="7.8" fill="#F8D2DB" opacity=".45"/>
  <ellipse cx="108" cy="434" rx="80" ry="10.6" stroke="#F8D2DB" stroke-width="1.2" stroke-dasharray="4 3.2" opacity=".95"/>
</svg>
