<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 98" width="256" height="98" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Membership card pinned level on the wall above the desk, seen straight on.
       Cream card (fill #FFF7EA, shade #F3E6D0, outline #D9C6A5) with a sage spine on the left (#B7D5B1 / #9FC49C / #7BA67D,
       highlight #CFE5C9), the green that marks sponsored access across the app. A sage seal with a check sits bottom right.
       Two push pins (pink and butter) hold it, one on the spine and one at the top right corner.
       Card face x 1.5..251.5, y 3..93 (radius 10), soft flat shadow on the wall offset 3 right and 4 down.
       Flat label zone for the page's live text: x 26..242, y 10..86; keep the bottom row clear of the seal (x 214..242, y 56..84). -->
  <defs>
    <clipPath id="acd-face"><rect x="1.5" y="3" width="250" height="90" rx="10"/></clipPath>
  </defs>

  <!-- shadow on the wall -->
  <rect x="4.5" y="7" width="250" height="90" rx="10.5" fill="#C98E9E" opacity=".16"/>

  <!-- face -->
  <rect x="1.5" y="3" width="250" height="90" rx="10" fill="#FFF7EA"/>
  <g clip-path="url(#acd-face)">
    <!-- the lower edge in the cream shade, so the card has a little thickness -->
    <rect x="0" y="88.4" width="256" height="6" fill="#F3E6D0"/>
    <!-- sage spine -->
    <rect x="0" y="0" width="14" height="98" fill="#B7D5B1"/>
    <rect x="10.4" y="0" width="3.6" height="98" fill="#9FC49C"/>
    <path d="M4.6 8V88" stroke="#CFE5C9" stroke-width="1.2"/>
    <!-- stitching down the spine -->
    <path d="M7.6 20V84" stroke="#7BA67D" stroke-width="1" stroke-dasharray="2.4 2.6" opacity=".7"/>
  </g>
  <path d="M14 3.6V92.4" stroke="#7BA67D" stroke-width="1.2"/>
  <!-- light along the top edge and a fine inner rule -->
  <path d="M22 5.4H241" stroke="#FFFFFF" stroke-width="1.1"/>
  <rect x="19" y="8.5" width="227" height="79" rx="6" stroke="#EADBC2" stroke-width=".9"/>
  <rect x="1.5" y="3" width="250" height="90" rx="10" stroke="#D9C6A5" stroke-width="1.4"/>
  <!-- the spine's own outline over the card edge -->
  <path d="M11.5 3H14V93H11.5A10 10 0 0 1 1.5 83V13A10 10 0 0 1 11.5 3Z" stroke="#7BA67D" stroke-width="1.4"/>

  <!-- sage seal with a check, bottom right -->
  <circle cx="228.4" cy="70.6" r="12.6" fill="#7BA67D" opacity=".18" transform="translate(1 1.4)"/>
  <circle cx="228.4" cy="70.6" r="12.6" fill="#B7D5B1"/>
  <path d="M228.4 83.2A12.6 12.6 0 0 0 241 70.6H215.8A12.6 12.6 0 0 0 228.4 83.2Z" fill="#9FC49C" opacity=".75"/>
  <circle cx="228.4" cy="70.6" r="9" stroke="#CFE5C9" stroke-width="1" stroke-dasharray="1.6 1.8"/>
  <path d="M219.6 65.4A10.4 10.4 0 0 1 224.6 60.4" stroke="#DCEDD6" stroke-width="1.2"/>
  <circle cx="228.4" cy="70.6" r="12.6" stroke="#7BA67D" stroke-width="1.35"/>
  <path d="M223.4 70.8L226.9 74.2L233.6 66.8" stroke="#44795A" stroke-width="1.9"/>

  <!-- push pins: a pink one on the spine, a butter one at the top right -->
  <ellipse cx="9.4" cy="15.4" rx="4.4" ry="2" fill="#7A4636" opacity=".14"/>
  <circle cx="8" cy="12.4" r="4.8" fill="#F4B4C2"/>
  <path d="M8 17.2A4.8 4.8 0 0 0 12.8 12.4H3.2A4.8 4.8 0 0 0 8 17.2Z" fill="#EC9DB0"/>
  <circle cx="6.4" cy="10.8" r="1.4" fill="#FCD9E0"/>
  <circle cx="8" cy="12.4" r="4.8" stroke="#D97F97" stroke-width="1.3"/>

  <ellipse cx="241.4" cy="15.4" rx="4.4" ry="2" fill="#7A4636" opacity=".14"/>
  <circle cx="240" cy="12.4" r="4.8" fill="#FBE9A6"/>
  <path d="M240 17.2A4.8 4.8 0 0 0 244.8 12.4H235.2A4.8 4.8 0 0 0 240 17.2Z" fill="#F3D97C"/>
  <circle cx="238.4" cy="10.8" r="1.4" fill="#FFF8D8"/>
  <circle cx="240" cy="12.4" r="4.8" stroke="#DDBB4E" stroke-width="1.3"/>
</svg>
