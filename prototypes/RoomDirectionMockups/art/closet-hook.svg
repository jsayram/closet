<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 38" width="44" height="38" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A single wall hook: a small cream painted plaque with an arched top and a turned brass peg near its foot.
       Cream: fill #FFF7EA, shade #F3E6D0, outline #D9C6A5. Brass (wood tones): fill #E7BC6E, shade #D9A650,
       outline #B98632, highlight #F6DC9C.
       Contract: peg centre at (22, 26). Plaque x 5..39, y 2..30, so a hanger whose hook loop is centred on the peg
       hangs with its bar clear below the plaque (bar top about 6 px under the peg centre at 1.15 scale).
       The knob cap is the circle r 3.4 at (22, 26). To show the hanger's hook going behind the cap, place a second
       copy of this file over the garment inside a round clip of r 3.6 centred on the peg. -->

  <!-- soft shadow of the plaque on the wall -->
  <path d="M7 31.6 H38.6 Q40.6 31.6 40.6 29.6 V15.6 C40.6 13 39.6 11 38 9.6 V30 Q38 31 37 31 Z" fill="#E7B9C2" opacity=".55"/>

  <!-- plaque body -->
  <path d="M5 28 V14.4 C5 9 8.6 6.2 12.8 6.2 C14.8 3.5 18.2 2 22 2 C25.8 2 29.2 3.5 31.2 6.2 C35.4 6.2 39 9 39 14.4 V28 Q39 30 37 30 H7 Q5 30 5 28 Z" fill="#FFF7EA"/>
  <!-- shade along the foot and the right side -->
  <path d="M5 25.6 H39 V28 Q39 30 37 30 H7 Q5 30 5 28 Z" fill="#F3E6D0"/>
  <path d="M36.6 9.4 C38.1 10.6 39 12.3 39 14.4 V26 H36.6 Z" fill="#F3E6D0"/>
  <!-- routed edge: an inset line that follows the outline -->
  <path d="M8.6 25 V15 C8.6 11.6 10.8 9.6 13.8 9.6 C15.6 7.2 18.6 5.8 22 5.8 C25.4 5.8 28.4 7.2 30.2 9.6 C33.2 9.6 35.4 11.6 35.4 15 V25" stroke="#E6D6BA" stroke-width="1.1"/>
  <!-- highlight along the arch -->
  <path d="M9.4 12.4 C10.2 10.4 11.6 9.1 13.6 8.7 M16.4 6.1 C17.9 5 19.8 4.4 22 4.3" stroke="#FFFFFF" stroke-width="1.3"/>
  <!-- outline -->
  <path d="M5 28 V14.4 C5 9 8.6 6.2 12.8 6.2 C14.8 3.5 18.2 2 22 2 C25.8 2 29.2 3.5 31.2 6.2 C35.4 6.2 39 9 39 14.4 V28 Q39 30 37 30 H7 Q5 30 5 28 Z" stroke="#D9C6A5" stroke-width="1.3"/>

  <!-- two brass screws -->
  <circle cx="12" cy="15.6" r="1.6" fill="#E7BC6E" stroke="#B98632" stroke-width=".9"/>
  <path d="M11.2 16.4 L12.8 14.8" stroke="#B98632" stroke-width=".7"/>
  <circle cx="32" cy="15.6" r="1.6" fill="#E7BC6E" stroke="#B98632" stroke-width=".9"/>
  <path d="M31.2 16.4 L32.8 14.8" stroke="#B98632" stroke-width=".7"/>

  <!-- turned brass peg: rosette ring, its shadow, then the knob cap -->
  <ellipse cx="22.8" cy="27.4" rx="5.8" ry="5" fill="#D9C6A5" opacity=".6"/>
  <circle cx="22" cy="26" r="5.4" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>
  <circle cx="22" cy="26" r="3.4" fill="#E7BC6E" stroke="#B98632" stroke-width="1.1"/>
  <path d="M19.8 25.2 A2.4 2.4 0 0 1 21.4 23.6" stroke="#F6DC9C" stroke-width="1.2"/>
  <path d="M24.2 28.1 A3 3 0 0 1 21 28.9" stroke="#D9A650" stroke-width="1"/>
</svg>
