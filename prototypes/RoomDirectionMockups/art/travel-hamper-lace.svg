    <path d="M2.0 41.5h6.4M14.0 41.5h6.4M26.0 41.5h6.4M38.0 41.5h6.4M50.0 41.5h6.4M62.0 41.5h6.4M74.0 41.5h6.4M8.0 48.5h6.4M20.0 48.5h6.4M32.0 48.5h6.4M44.0 48.5h6.4M56.0 48.5h6.4M68.0 48.5h6.4M80.0 48.5h6.4M2.0 55.5h6.4M14.0 55.5h6.4M26.0 55.5h6.4M38.0 55.5h6.4M50.0 55.5h6.4M62.0 55.5h6.4M74.0 55.5h6.4M8.0 62.5h6.4M20.0 62.5h6.4M32.0 62.5h6.4M44.0 62.5h6.4M56.0 62.5h6.4M68.0 62.5h6.4M80.0 62.5h6.4M2.0 69.5h6.4M14.0 69.5h6.4M26.0 69.5h6.4M38.0 69.5h6.4M50.0 69.5h6.4M62.0 69.5h6.4M74.0 69.5h6.4M8.0 76.5h6.4M20.0 76.5h6.4M32.0 76.5h6.4M44.0 76.5h6.4M56.0 76.5h6.4M68.0 76.5h6.4M80.0 76.5h6.4M2.0 83.5h6.4M14.0 83.5h6.4M26.0 83.5h6.4M38.0 83.5h6.4M50.0 83.5h6.4M62.0 83.5h6.4M74.0 83.5h6.4M8.0 90.5h6.4M20.0 90.5h6.4M32.0 90.5h6.4M44.0 90.5h6.4M56.0 90.5h6.4M68.0 90.5h6.4M80.0 90.5h6.4M2.0 97.5h6.4M14.0 97.5h6.4M26.0 97.5h6.4M38.0 97.5h6.4M50.0 97.5h6.4M62.0 97.5h6.4M74.0 97.5h6.4M8.0 104.5h6.4M20.0 104.5h6.4M32.0 104.5h6.4M44.0 104.5h6.4M56.0 104.5h6.4M68.0 104.5h6.4M80.0 104.5h6.4" stroke="#F0CB84" stroke-width="3.6"/>
