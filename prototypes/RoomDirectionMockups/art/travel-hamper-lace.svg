  <path d="M5.4 30.6l3.2 6.4M10.4 30.6l3.2 6.4M15.4 30.6l3.2 6.4M20.4 30.6l3.2 6.4M25.4 30.6l3.2 6.4M30.4 30.6l3.2 6.4M35.4 30.6l3.2 6.4M40.4 30.6l3.2 6.4M45.4 30.6l3.2 6.4M50.4 30.6l3.2 6.4M55.4 30.6l3.2 6.4M60.4 30.6l3.2 6.4M65.4 30.6l3.2 6.4M70.4 30.6l3.2 6.4M75.4 30.6l3.2 6.4M80.4 30.6l2.6 5.2" stroke="#D9A650" stroke-width="1.2"/>
  <path d="M6 31H82" stroke="#F3D391" stroke-width="1" opacity=".9"/>
