<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 116" width="88" height="116" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Woven laundry hamper with only the white lace top (g-lace-top) left in it: the black tee has been marked clean.
       Ids are prefixed tp-. Wicker uses the wood tones #E7BC6E / #D9A650 / #B98632, highlight #F3D391.
       Rim y 29..38.5 (x 1.5..86.5). Basket bottom y 110; place it so y 110 lands on or just below the floor line. No label zone.
       Same drawing and size as travel-hamper.svg (88 x 116), so laundry.html can swap between them as pieces are marked clean. -->
  <defs>
    <clipPath id="tp-body"><path d="M4 34H84L79.4 104Q79 110 73 110H15Q9 110 8.6 104Z"/></clipPath>
    <clipPath id="tp-lace-body"><path d="M6.6 33C6 25.4 11.6 19.6 20 18.2C28.4 16.8 38.4 17.8 44.2 22.4C47.2 24.8 48 28.6 47.4 33Z"/></clipPath>
    <clipPath id="tp-lace-sleeve"><path d="M16.2 31.4C13.8 40 11 50 10.4 60.6Q13 63.2 15.6 61Q18.2 63.4 20.8 61.2Q23.2 63.4 25.6 61C26.4 50.8 29.6 40.6 33.4 31.6Z"/></clipPath>
  </defs>

