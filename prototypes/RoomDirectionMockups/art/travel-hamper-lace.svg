    <path d="M12 26.6h.01M18 23.4h.01M24 21.6h.01M30 21.4h.01M36 22.6h.01M42 25.4h.01M15 30.4h.01M21 28h.01M27 26.8h.01M33 27h.01M39 28.8h.01M45 31h.01M10.4 32.4h.01" stroke="#D6C09C" stroke-width="1.7"/>
    <path d="M10.4 27.4C12.6 23.4 16.4 21 20.6 20.2" stroke="#FFFFFF" stroke-width="1.4"/>
  </g>
  <path d="M18.6 20.4q1.6 1.8 3.2 0q1.6 1.8 3.2 0q1.6 1.8 3.2 0q1.6 1.8 3.2 0" stroke="#C6AA80" stroke-width="1"/>
