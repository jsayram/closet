  <path d="M16.2 31.4C13.8 40 11 50 10.4 60.6Q13 63.2 15.6 61Q18.2 63.4 20.8 61.2Q23.2 63.4 25.6 61C26.4 50.8 29.6 40.6 33.4 31.6" stroke="#C6AA80" stroke-width="1.25"/>
