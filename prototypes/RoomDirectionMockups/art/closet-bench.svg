<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 66" width="160" height="66" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small upholstered bench for the dressing corner: a tufted pink cushion on a wood apron with four tapered legs.
       Seen from a little above, so the cushion shows its top face.
       Contract: cushion x 6..154, top face y 8..20, front y 20..31; apron y 31..38; front legs to y 61, back legs to y 56.
       Floor contact shadow centred at (80, 62.4). Front legs stand on y 61, so place the bench with y 61 a few px below the
       screen's floor line. The space under the apron (x 26..134, y 38..60) is clear for a pair of shoes.
       Pink: fill #F4B4C2, shade #EC9DB0, outline #D97F97, highlight #FAD3DC. Wood: #E7BC6E / #D9A650 / #B98632 / #F3D391. -->

  <!-- floor contact shadow -->
  <ellipse cx="80" cy="62.4" rx="72" ry="3.4" fill="#8A5A48" opacity=".13"/>

  <!-- back legs, shorter and in shade -->
  <path d="M23 36H29L28.2 55.2C28.1 56 27.6 56.4 26.8 56.4H25.2C24.4 56.4 23.9 56 23.8 55.2Z" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>
  <path d="M131 36H137L136.2 55.2C136.1 56 135.6 56.4 134.8 56.4H133.2C132.4 56.4 131.9 56 131.8 55.2Z" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>

  <!-- apron -->
  <rect x="10" y="30" width="140" height="8" rx="1.6" fill="#E7BC6E"/>
  <path d="M10 30H150V32.2H10Z" fill="#F3D391"/>
  <path d="M10 36.4H150V37A1 1 0 0 1 149 38H11A1 1 0 0 1 10 37Z" fill="#D9A650"/>
  <path d="M40 34.4h12M74 34.2h14M110 34.5h8" stroke="#D9A650" stroke-width=".9"/>
  <rect x="10" y="30" width="140" height="8" rx="1.6" stroke="#B98632" stroke-width="1.3"/>

  <!-- front legs: tapered, light on the left, shade on the right -->
  <g>
    <path d="M14 37.4H24L22.2 59.6C22.1 60.5 21.4 61.2 20.5 61.2H17.5C16.6 61.2 15.9 60.5 15.8 59.6Z" fill="#E7BC6E"/>
    <path d="M19.4 37.4H24L22.2 59.6C22.1 60.5 21.4 61.2 20.5 61.2H19.2Z" fill="#D9A650"/>
    <path d="M16.8 40.4L17.8 57.6" stroke="#F3D391" stroke-width="1.1"/>
    <path d="M14 37.4H24L22.2 59.6C22.1 60.5 21.4 61.2 20.5 61.2H17.5C16.6 61.2 15.9 60.5 15.8 59.6Z" stroke="#B98632" stroke-width="1.3"/>
    <path d="M136 37.4H146L144.2 59.6C144.1 60.5 143.4 61.2 142.5 61.2H139.5C138.6 61.2 137.9 60.5 137.8 59.6Z" fill="#E7BC6E"/>
    <path d="M141.4 37.4H146L144.2 59.6C144.1 60.5 143.4 61.2 142.5 61.2H141.2Z" fill="#D9A650"/>
    <path d="M138.8 40.4L139.8 57.6" stroke="#F3D391" stroke-width="1.1"/>
    <path d="M136 37.4H146L144.2 59.6C144.1 60.5 143.4 61.2 142.5 61.2H139.5C138.6 61.2 137.9 60.5 137.8 59.6Z" stroke="#B98632" stroke-width="1.3"/>
  </g>

  <!-- cushion front -->
  <path d="M6 19H154V26.4C154 29.2 152.2 31 149.4 31H10.6C7.8 31 6 29.2 6 26.4Z" fill="#F4B4C2"/>
  <path d="M6 26.2H154V26.4C154 29.2 152.2 31 149.4 31H10.6C7.8 31 6 29.2 6 26.4Z" fill="#EC9DB0"/>
  <!-- soft pleats where the tufts pull the front -->
  <path d="M52 21.4C51.4 23 51.6 24.4 52.4 25.6M80 21.4C79.4 23 79.6 24.4 80.4 25.6M108 21.4C107.4 23 107.6 24.4 108.4 25.6" stroke="#E595A9" stroke-width="1"/>

  <!-- cushion top face -->
  <path d="M15 8H145C149.6 8 152.6 10.4 153.6 14.4L154.4 19.4C154.6 20.4 153.9 21 152.8 21H7.2C6.1 21 5.4 20.4 5.6 19.4L6.4 14.4C7.4 10.4 10.4 8 15 8Z" fill="#F9CDD7"/>
  <path d="M16 10.6H90" stroke="#FAD3DC" stroke-width="1.4"/>
  <!-- tufts: a small button and four short creases each -->
  <g stroke="#E595A9" stroke-width=".9">
    <path d="M45.6 13.2L48.6 14.6M54.4 13.2L51.4 14.6M45.6 17.4L48.6 16M54.4 17.4L51.4 16"/>
    <path d="M75.6 13.2L78.6 14.6M84.4 13.2L81.4 14.6M75.6 17.4L78.6 16M84.4 17.4L81.4 16"/>
    <path d="M105.6 13.2L108.6 14.6M114.4 13.2L111.4 14.6M105.6 17.4L108.6 16M114.4 17.4L111.4 16"/>
  </g>
  <circle cx="50" cy="15.3" r="1.6" fill="#EC9DB0" stroke="#D97F97" stroke-width=".9"/>
  <circle cx="80" cy="15.3" r="1.6" fill="#EC9DB0" stroke="#D97F97" stroke-width=".9"/>
  <circle cx="110" cy="15.3" r="1.6" fill="#EC9DB0" stroke="#D97F97" stroke-width=".9"/>
  <!-- piping along the front edge of the top -->
  <path d="M6.6 20.6H153.4" stroke="#FFF7EA" stroke-width="1.6"/>

  <!-- cushion outline -->
  <path d="M15 8H145C149.6 8 152.6 10.4 153.6 14.4L154.4 19.4V26.4C154 29.2 152.2 31 149.4 31H10.6C7.8 31 6 29.2 5.6 26.4V19.4L6.4 14.4C7.4 10.4 10.4 8 15 8Z" stroke="#D97F97" stroke-width="1.4"/>
</svg>
