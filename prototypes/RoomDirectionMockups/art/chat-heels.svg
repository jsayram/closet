<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 15" width="46" height="15" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The black block heels (g-black-heels) standing as a pair on a pink room floor, toes left, for the look card
       in Ask stylist. Same shoe outline as garments.js, drawn at 0.24 like chat-flats.svg, so one shoe is about
       22 px long. Heels and toes rest on y 13.4. Stroke widths land near 0.9 to 1 px.
       Tones from garments.js: fill #2E2A30, shade #1F1C21, highlight #4E4853, outline #111013,
       lining #D6B898 / #EBD6BE, sole #B8926C. Contact shadow: the floor tone darkened, 13 percent.
       Ids are prefixed ch-. -->
  <defs>
    <path id="ch-upper" d="M1.5 46C3.5 41.5 13 36.5 24 33C29 31.6 33 31 36.5 31.5C40 36.6 47 38.6 55 36C66 32.4 76 22 82 11.6C83.4 9 86.4 7.6 88.8 9.2C91.6 11.8 92.6 17 92.6 22L92.4 26L75 28.5C67 34 55 43 44.5 47.2C39 49 31 49.2 22 49.2L7 49.2C3 49.2 .8 48.4 1.5 46Z"/>
    <path id="ch-open" d="M36.5 31.5C46 22 66 9.6 82 6.6C85.6 6 88 7.2 88.8 9.2C86.4 7.6 83.4 9 82 11.6C76 22 66 32.4 55 36C47 38.6 40 36.6 36.5 31.5Z"/>
    <clipPath id="ch-clip-u"><use href="#ch-upper"/></clipPath>
    <g id="ch-shoe">
      <!-- block heel -->
      <path d="M75.6 28L92.5 25.6L91.4 49Q91.3 50.4 89.9 50.4L80.2 50.4Q78.9 50.4 78.6 49.1Z" fill="#1F1C21" stroke="#111013" stroke-width="3.6"/>
      <path d="M79 31.4L80.6 46.6" stroke="#4E4853" stroke-width="2.6"/>
      <!-- sole under the toe and arch -->
      <path d="M3 47.2H42C52 44 62 37 72 29.6L73.6 31.4C64 39 54 46 43 49.4Q40 50.4 36 50.4H6C3 50.4 2 49.2 3 47.2Z" fill="#B8926C" stroke="#111013" stroke-width="2.8"/>
      <!-- opening with its lining -->
      <use href="#ch-open" fill="#EBD6BE" stroke="#111013" stroke-width="3.2"/>
      <!-- upper: fill, one highlight along the toe, the shade under it -->
      <use href="#ch-upper" fill="#2E2A30"/>
      <g clip-path="url(#ch-clip-u)">
        <path d="M0 44L44 44C34 50 10 51 0 51Z" fill="#1F1C21"/>
        <path d="M8 41.6C14 38.2 20 35.8 26.4 34.2" stroke="#4E4853" stroke-width="4"/>
        <path d="M58 36C66 31 73 24 79 16" stroke="#4E4853" stroke-width="3"/>
      </g>
      <use href="#ch-upper" stroke="#111013" stroke-width="4"/>
    </g>
  </defs>

  <!-- contact shadow on the floor (floor shade darkened) -->
  <ellipse cx="22.4" cy="13.6" rx="21" ry="1.35" fill="#9C5E4C" opacity=".13"/>

  <!-- far shoe, set back and to the right -->
  <use href="#ch-shoe" transform="translate(18.6 .2) scale(.24)"/>
  <!-- near shoe -->
  <use href="#ch-shoe" transform="translate(1.4 1.3) scale(.24)"/>
</svg>
