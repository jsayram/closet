<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 96" width="66" height="96" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The kit's table lamp (lamp.svg) redrawn at 1.5x for the Styling access desk, which is seen close up.
       Cream-butter dome shade with soft pleats and a pull chain, slim gold stem, flat round base with a small step.
       Stem centred at x 33; base bottom at y 93.8 (stand it there on the desk). Outlines stay 1.25 to 1.5. -->
  <defs>
    <clipPath id="alp-dome">
      <path d="M4.5 33.6C4.5 15.6 16.5 5.4 33 5.4C49.5 5.4 61.5 15.6 61.5 33.6C61.5 35.4 60.3 36.6 58.5 36.6H7.5C5.7 36.6 4.5 35.4 4.5 33.6Z"/>
    </clipPath>
  </defs>

  <!-- base: a flat disc seen a little from above -->
  <path d="M11 89.6C11 87.8 20.8 86.6 33 86.6C45.2 86.6 55 87.8 55 89.6V91.4C55 92.7 53.9 93.8 52.6 93.8H13.4C12.1 93.8 11 92.7 11 91.4Z" fill="#E7BC6E"/>
  <path d="M11 89.6C11 91.2 20.8 92.4 33 92.4C45.2 92.4 55 91.2 55 89.6V91.4C55 92.7 53.9 93.8 52.6 93.8H13.4C12.1 93.8 11 92.7 11 91.4Z" fill="#D9A650"/>
  <path d="M16.6 88.7C20.2 88 24.4 87.7 28 87.6" stroke="#F8E3B0" stroke-width="1.1"/>
  <path d="M11 89.6C11 87.8 20.8 86.6 33 86.6C45.2 86.6 55 87.8 55 89.6V91.4C55 92.7 53.9 93.8 52.6 93.8H13.4C12.1 93.8 11 92.7 11 91.4Z" stroke="#B98632" stroke-width="1.4"/>
  <!-- a small round switch on the base -->
  <ellipse cx="45.4" cy="89.4" rx="3.2" ry="1.5" fill="#FFF7EA" stroke="#B98632" stroke-width="1.1"/>
  <!-- small step the stem rises from -->
  <path d="M24.3 87.6C24.3 86.1 28.2 85 33 85C37.8 85 41.7 86.1 41.7 87.6V88.3C41.7 89 41.1 89.5 40.4 89.5H25.6C24.9 89.5 24.3 89 24.3 88.3Z" fill="#E7BC6E"/>
  <path d="M33 85C37.8 85 41.7 86.1 41.7 87.6V88.3C41.7 89 41.1 89.5 40.4 89.5H33Z" fill="#D9A650"/>
  <path d="M24.3 87.6C24.3 86.1 28.2 85 33 85C37.8 85 41.7 86.1 41.7 87.6V88.3C41.7 89 41.1 89.5 40.4 89.5H25.6C24.9 89.5 24.3 89 24.3 88.3Z" stroke="#B98632" stroke-width="1.3"/>

  <!-- stem -->
  <rect x="30.3" y="38.4" width="5.4" height="47.2" fill="#E7BC6E"/>
  <rect x="33.5" y="38.4" width="2.2" height="47.2" fill="#D9A650"/>
  <path d="M31.7 41.4V82.4" stroke="#F8E3B0" stroke-width=".9"/>
  <path d="M30.3 39.6V85.4M35.7 39.6V85.4" stroke="#B98632" stroke-width="1.3"/>
  <!-- a small knuckle halfway up -->
  <rect x="29.2" y="60.6" width="7.6" height="3.6" rx="1.6" fill="#E7BC6E" stroke="#B98632" stroke-width="1.2"/>
  <!-- collar where the stem meets the shade -->
  <rect x="27.4" y="35.8" width="11.2" height="5" rx="2" fill="#D9A650" stroke="#B98632" stroke-width="1.3"/>

  <!-- pull chain under the shade -->
  <path d="M46 36.8V48.6" stroke="#B98632" stroke-width="1" stroke-dasharray="1.2 1.4"/>
  <circle cx="46" cy="50.4" r="1.9" fill="#E7BC6E" stroke="#B98632" stroke-width="1.1"/>

  <!-- finial -->
  <rect x="29.8" y="1.2" width="6.4" height="6.6" rx="3.2" fill="#E7BC6E" stroke="#B98632" stroke-width="1.3"/>
  <circle cx="31.9" cy="3.6" r="1" fill="#F8E3B0"/>

  <!-- shade -->
  <path d="M4.5 33.6C4.5 15.6 16.5 5.4 33 5.4C49.5 5.4 61.5 15.6 61.5 33.6C61.5 35.4 60.3 36.6 58.5 36.6H7.5C5.7 36.6 4.5 35.4 4.5 33.6Z" fill="#FDF1C6"/>
  <g clip-path="url(#alp-dome)">
    <!-- turned-away side -->
    <path d="M43.5 3C56.4 10.5 62.4 24 63.6 40.5H48.9C50.7 26.1 49.2 13.5 40.5 3Z" fill="#F8E4A4"/>
    <!-- soft pleats -->
    <path d="M22.6 9C18.4 15.6 16.8 23 16.6 31M33 6V31M43.2 9C47.4 15.6 49 23 49.2 31" stroke="#F1DA92" stroke-width="1"/>
    <!-- rim band -->
    <rect x="3" y="31" width="60" height="6.6" fill="#F3D97C"/>
    <path d="M6 33.6H60" stroke="#F8E6A8" stroke-width=".9"/>
    <!-- light catching the upper left -->
    <path d="M12.3 26.6C13.5 17.4 19.5 11.6 27.3 9.6" stroke="#FFFBEA" stroke-width="2.6"/>
  </g>
  <path d="M5.4 31H60.6" stroke="#E6C85C" stroke-width="1"/>
  <path d="M4.5 33.6C4.5 15.6 16.5 5.4 33 5.4C49.5 5.4 61.5 15.6 61.5 33.6C61.5 35.4 60.3 36.6 58.5 36.6H7.5C5.7 36.6 4.5 35.4 4.5 33.6Z" stroke="#DDBB4E" stroke-width="1.5"/>
</svg>
