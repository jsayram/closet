<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 78" width="210" height="78" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dressing corner wall shelf: a wood board on two shaped brackets, with a gold hanging rod between the brackets
       under the board. On the board: two folded linens on the left and a round hat box on the right; the middle stays clear
       above the hanger hook.
       Contract: board x 3..207, y 36..47 (top face 36..39, front edge 39..47), the same 11-unit profile as shelf-top.
       Brackets x 22..36 and 174..188, y 47..76. Rod centre y 62, x 36..174 (a hanger hook at 60/120 of its garment box
       sits on it; put the garment's rail line, y 11 in garment units, on y 62). Things on the board reach up to y 9.
       Wood: fill #E7BC6E, shade #D9A650, outline #B98632, highlight #F3D391 / #F6DC9C. -->
  <defs>
    <!-- shaped bracket seen from the front, 14 wide: a square head under the board, then a scrolled taper to a round toe -->
    <g id="cr-bracket">
      <path d="M0 0H14V6C14 9 12.4 10.4 11.4 12.6C10.2 15.4 10.6 19 10.2 22.6C9.9 26 8.8 29 7 29C5.2 29 4.1 26 3.8 22.6C3.4 19 3.8 15.4 2.6 12.6C1.6 10.4 0 9 0 6Z" fill="#E7BC6E"/>
      <path d="M7.6 0H14V6C14 9 12.4 10.4 11.4 12.6C10.2 15.4 10.6 19 10.2 22.6C9.9 26 8.8 29 7 29H7.6Z" fill="#D9A650"/>
      <path d="M0 0H14V2.4H0Z" fill="#D9A650"/>
      <path d="M3.4 4.6V7.4M4.8 14.6C5.4 17.4 5.2 20.6 5.6 23.4" stroke="#F3D391" stroke-width="1.1"/>
      <path d="M1.2 8.8H12.8" stroke="#CF9D45" stroke-width=".9"/>
      <path d="M0 0H14V6C14 9 12.4 10.4 11.4 12.6C10.2 15.4 10.6 19 10.2 22.6C9.9 26 8.8 29 7 29C5.2 29 4.1 26 3.8 22.6C3.4 19 3.8 15.4 2.6 12.6C1.6 10.4 0 9 0 6Z" stroke="#B98632" stroke-width="1.3"/>
    </g>
    <!-- one folded linen, 54 x 11, the same build as the folded knits inside the armoire -->
    <symbol id="cr-fold" viewBox="0 0 54 11" width="54" height="11" overflow="visible">
      <path d="M4.4 .7H49.6Q53.3 .7 53.3 4.6V6.6Q53.3 10.3 49.6 10.3H4.4Q.7 10.3 .7 6.6V4.6Q.7 .7 4.4 .7Z" fill="var(--f)"/>
      <path d="M.8 6.9H53.2Q53.2 10.3 49.6 10.3H4.4Q.8 10.3 .8 6.9Z" fill="var(--s)"/>
      <path d="M6 6.9H48" stroke="var(--l)" stroke-width=".9" opacity=".7"/>
      <path d="M5.4 2.7H30" stroke="var(--h)" stroke-width="1.3"/>
      <path d="M41 1.4C42.6 3.4 42.6 5.2 41.6 6.8" stroke="var(--l)" stroke-width="1" opacity=".7"/>
      <path d="M4.4 .7H49.6Q53.3 .7 53.3 4.6V6.6Q53.3 10.3 49.6 10.3H4.4Q.7 10.3 .7 6.6V4.6Q.7 .7 4.4 .7Z" stroke="var(--l)" stroke-width="1.3"/>
    </symbol>
  </defs>

  <!-- soft shadow of the board and the rod on the wall -->
  <path d="M8 48.6H202" stroke="#EDBFCA" stroke-width="2.6" opacity=".7"/>
  <path d="M40 67.6H170" stroke="#EDBFCA" stroke-width="2.2" opacity=".6"/>

  <!-- rod, between the brackets -->
  <path d="M34 62H176" stroke="#B98632" stroke-width="5.4"/>
  <path d="M34 62H176" stroke="#E7BC6E" stroke-width="3.1"/>
  <path d="M37 61H173" stroke="#F6DC9C" stroke-width="1"/>

  <!-- brackets, with the rod's round end caps on their inner faces -->
  <use href="#cr-bracket" x="22" y="47"/>
  <use href="#cr-bracket" x="174" y="47"/>
  <circle cx="36.4" cy="62" r="3.3" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>
  <circle cx="35.6" cy="61.1" r="1" fill="#F6DC9C"/>
  <circle cx="173.6" cy="62" r="3.3" fill="#D9A650" stroke="#B98632" stroke-width="1.2"/>
  <circle cx="172.8" cy="61.1" r="1" fill="#F6DC9C"/>

  <!-- board -->
  <rect x="3" y="36" width="204" height="11" rx="1.8" fill="#E7BC6E"/>
  <path d="M4.8 36H205.2A1.8 1.8 0 0 1 207 37.8V39H3V37.8A1.8 1.8 0 0 1 4.8 36Z" fill="#F3D391"/>
  <path d="M3 45.2H207A1.8 1.8 0 0 1 205.2 47H4.8A1.8 1.8 0 0 1 3 45.2Z" fill="#D9A650"/>
  <path d="M3.5 39H206.5" stroke="#CF9D45" stroke-width=".8"/>
  <path d="M10 42h14M31 42.6h7M70 41.8h12M98 42.4h6M120 42h10M186 42.2h14" stroke="#D9A650" stroke-width=".9"/>
  <!-- shadows of the linens and the box on the top face -->
  <path d="M32 37.6H82" stroke="#DDB05E" stroke-width="1.6"/>
  <ellipse cx="164" cy="37.7" rx="20" ry="1.4" fill="#DDB05E"/>
  <rect x="3" y="36" width="204" height="11" rx="1.8" stroke="#B98632" stroke-width="1.3"/>

  <!-- folded linens: pink underneath, cream on top, set a little off each other -->
  <use href="#cr-fold" x="29" y="25.6" style="--f:#F4B4C2;--s:#EC9DB0;--h:#F9CFD8;--l:#D97F97"/>
  <use href="#cr-fold" x="31.4" y="15.2" style="--f:#FFF7EA;--s:#F3E6D0;--h:#FFFFFF;--l:#D9C6A5"/>

  <!-- hat box: a cream drum with a lilac lid and a lilac band -->
  <g>
    <!-- body -->
    <path d="M145 16V33.4C145 35.4 153.4 37 164 37C174.6 37 183 35.4 183 33.4V16Z" fill="#FFF7EA"/>
    <path d="M174 16V36.3C179.4 35.7 183 34.6 183 33.4V16Z" fill="#F3E6D0"/>
    <path d="M148.4 19.4V32.2" stroke="#FFFFFF" stroke-width="1.4"/>
    <!-- band -->
    <path d="M145 25.4C145 27.4 153.4 29 164 29C174.6 29 183 27.4 183 25.4V30C183 32 174.6 33.6 164 33.6C153.4 33.6 145 32 145 30Z" fill="#D8C6F0"/>
    <path d="M174 28.3C179.4 27.7 183 26.6 183 25.4V30C183 31.2 179.4 32.3 174 32.9Z" fill="#C3ABE6"/>
    <path d="M145 25.4C145 27.4 153.4 29 164 29C174.6 29 183 27.4 183 25.4M145 30C145 32 153.4 33.6 164 33.6C174.6 33.6 183 32 183 30" stroke="#A98CD6" stroke-width="1"/>
    <path d="M145 16V33.4C145 35.4 153.4 37 164 37C174.6 37 183 35.4 183 33.4V16" stroke="#D9C6A5" stroke-width="1.3"/>
    <!-- lid: rim and top -->
    <path d="M143 12.6V17.2C143 19.4 152.4 21.2 164 21.2C175.6 21.2 185 19.4 185 17.2V12.6Z" fill="#D8C6F0"/>
    <path d="M175 12.6V20.5C180.8 19.8 185 18.6 185 17.2V12.6Z" fill="#C3ABE6"/>
    <path d="M143 12.6V17.2C143 19.4 152.4 21.2 164 21.2C175.6 21.2 185 19.4 185 17.2V12.6" stroke="#A98CD6" stroke-width="1.3"/>
    <ellipse cx="164" cy="12.6" rx="21" ry="3.6" fill="#E6DAF7" stroke="#A98CD6" stroke-width="1.3"/>
    <path d="M150 11.6C154 10.4 159 10 163.6 10" stroke="#F6F0FD" stroke-width="1.2"/>
  </g>
</svg>
