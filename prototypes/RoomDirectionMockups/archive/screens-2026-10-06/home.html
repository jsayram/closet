<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Home</title>
<link rel="stylesheet" href="../css/room.css">
<style>
  /* Style Me tab, the bedroom. Built from ref/home.png at 0.3988 px per reference px.
     Floor line 550. The wardrobe is shown at 1.08 so its label zone can hold both plates. */
  body { background: var(--wall); }
  a, button { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }
  .room { --floor-y: 550px; }
  .art { position: absolute; display: block; }

  /* header */
  .hdr-title { position: absolute; left: 20px; top: 46px; }
  /* the Simulated label for the weather lives in the weather sheet, so the header line stays plain */
  .wx { position: absolute; left: 14px; top: 81px; height: 44px; padding: 0 4px 0 6px; display: flex; align-items: center; gap: 4px;
        color: var(--plum); font-size: 15px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; }
  .wx > i[data-icon] { font-size: 18px; margin-right: 1px; }
  .wx .chev { display: grid; }
  .wx .chev i[data-icon] { font-size: 13px; }

  /* shared plate tweaks */
  .tag b { letter-spacing: -.1px; }
  .hit { position: absolute; display: block; }
  .hit > .tag { position: absolute; }

  /* wardrobe plates: label zone at page x 9.6..152, y 152..230. Both plates run 4..156, a few px onto the stiles,
     so the suitcase line fits on one line with its lock icon at 11 px. */
  .src { left: 4px; top: 153px; width: 152px; height: 44px; padding: 4px 10px 4px 11px; gap: 8px; }
  .src i[data-icon] { font-size: 20px; }
  .src .txt { flex: 1; }
  .src .lbl { display: flex; align-items: center; justify-content: space-between; }
  .src .lbl i[data-icon] { font-size: 13px; color: var(--plum); }
  .lockp { left: 3px; top: 201px; width: 159px; height: 27px; min-height: 0; padding: 0 4px 0 6px; gap: 3px; border-radius: 9px;
           white-space: nowrap; font-size: 12px; font-weight: 600; letter-spacing: -.3px; color: #2F5536; }
  .lockp i[data-icon] { font-size: 12px; color: #3E6B45; }
  .rail { position: absolute; left: 14px; top: 234px; width: 136px; height: 114px; overflow: hidden; }
  .rail .g { position: absolute; }

  /* Saved Looks plate under the plant shelf */
  .saved { left: 0; top: 7px; width: 132px; height: 30px; min-height: 0; padding: 0 8px; gap: 5px; justify-content: center; border-radius: 10px; }
  .saved i[data-icon] { font-size: 17px; }
  .saved b { font-size: 13px; }
  .saved .end { margin-left: 1px; }
  .saved .end i[data-icon] { font-size: 13px; }
  .card-ov { position: absolute; display: block; }
  .card-ov .th { position: absolute; left: 0; top: 0; width: 40px; }

  /* calendar label, inside the flat face x 8..82, y 20..65 */
  .cal { position: absolute; display: flex; color: var(--ink); flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .cal .t { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
  .cal .t i[data-icon] { font-size: 14px; color: var(--plum); }
  .cal .pick { display: flex; align-items: center; gap: 1px; }
  .cal .chip { min-height: 24px; padding: 0 7px 0 5px; gap: 2px; font-size: 13px; }
  .cal .chip i[data-icon] { font-size: 11px; }
  .cal .pick > i[data-icon] { font-size: 12px; color: var(--plum); }


  /* her name sign on the wall: name-sign.svg with the profile's first name as live text over its flat panel */
  .sign { position: absolute; display: block; }
  .sign img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .sign .name { position: absolute; display: flex; align-items: center; justify-content: center;
                font-family: var(--font-display); font-weight: 700; font-style: italic; color: var(--plum); letter-spacing: .2px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }

  /* laptop screen button */
  .styleme { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
             color: #fff; font-size: 15px; font-weight: 700; border-radius: 3px; }
  .styleme i[data-icon] { font-size: 19px; }

  /* desk drawer plate */
  .more { left: 0; top: 4px; width: 94px; height: 36px; min-height: 0; padding: 2px 4px; gap: 0; flex-direction: column; justify-content: center; border-radius: 9px; }
  .more b { font-size: 13px; font-weight: 600; }
  .more i[data-icon] { font-size: 13px; color: var(--ink); }

  /* rack plates */
  .start { left: 0; top: 0; width: 122px; height: 44px; padding: 3px 4px 3px 8px; gap: 1px; flex-direction: column; align-items: flex-start; justify-content: center; }
  .start > b { display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 16px; }
  .start > b i[data-icon] { font-size: 14px; }
  .start .act { display: flex; align-items: center; gap: 1px; width: 100%; font-size: 13px; font-weight: 600; line-height: 16px; color: var(--plum); white-space: nowrap; letter-spacing: -.25px; }
  .start .act .chev { margin-left: auto; font-size: 11px; display: grid; }

  /* weather detail: a small sheet that the two weather controls open in place (no separate screen yet) */
  .wxsheet { position: absolute; left: 14px; top: 124px; width: 244px; z-index: 20; padding: 4px 4px 12px 14px;
             background: #fff; border: 1.5px solid var(--plate-line); border-radius: 16px; box-shadow: 0 8px 24px #5a2a4a33; }
  .wxsheet[hidden] { display: none; }
  .wxsheet .wh { display: flex; align-items: center; gap: 6px; min-height: 44px; }
  .wxsheet .wh > i[data-icon] { font-size: 19px; color: var(--plum); }
  .wxsheet .wh b { font-size: 15px; }
  .wxsheet .x { margin-left: auto; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-soft); font-size: 17px; }
  .wxsheet .big { font-size: 17px; font-weight: 700; line-height: 1.25; }
  .wxsheet .say { margin-top: 4px; padding-right: 10px; font-size: 13px; line-height: 1.35; color: var(--ink-soft); }

  /* tab bar items are links */
  .tabbar > a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px;
                font-size: 12px; font-weight: 600; color: var(--plum); }
  .tabbar > a i[data-icon] { font-size: 23px; }
  .tabbar > a.on { background: var(--plum); color: #fff; }
  /* Maya, the sleeping poodle: decoration only. Her z's float very slowly; still under reduced motion. */
  .maya, .maya-zzz { pointer-events: none; }
  .maya-zzz { animation: mayaZ 7s ease-in-out infinite; }
  @keyframes mayaZ { 0%, 100% { transform: translate(0, 0); opacity: 1; } 50% { transform: translate(1.5px, -3px); opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { .maya-zzz { animation: none; } }
</style>

<script>
/* Fit small garment drawings into a box (data-box = x,y,w,h in the parent's px) by their drawn bounds, and thicken
   their outlines so they land near 1.1 px, like the card outlines around them. Same method as the kit sheet. */
(function () {
  var TARGET = 1.1, OUTLINE = 3;
  function fit(el) {
    var svg = el.querySelector('svg');
    if (!svg || el.getAttribute('data-fitted')) return;
    var b = svg.getBBox();
    var box = el.getAttribute('data-box').split(',').map(Number);
    var s = Math.min(box[2] / b.width, box[3] / b.height);
    el.style.width = (120 * s).toFixed(2) + 'px';
    el.style.left = (box[0] + box[2] / 2 - (b.x + b.width / 2) * s).toFixed(2) + 'px';
    el.style.top = (box[1] + box[3] - (b.y + b.height) * s).toFixed(2) + 'px';
    var f = TARGET / (OUTLINE * s);
    var list = svg.querySelectorAll('[stroke-width]');
    for (var i = 0; i < list.length; i++) {
      var w = parseFloat(list[i].getAttribute('stroke-width'));
      if (w > 0) list[i].setAttribute('stroke-width', (w * f).toFixed(2));
    }
    el.setAttribute('data-fitted', '1');
  }
  function run() { var l = document.querySelectorAll('.fit'); for (var i = 0; i < l.length; i++) fit(l[i]); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
/* Weather sheet: either weather control opens it; the close button, Escape or a tap outside closes it. */
(function () {
  var sheet = document.getElementById('wx-sheet');
  var openers = document.querySelectorAll('[data-wx]');
  if (!sheet) return;
  function set(open, from) {
    sheet.hidden = !open;
    for (var i = 0; i < openers.length; i++) openers[i].setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) sheet.querySelector('[data-wx-close]').focus(); else if (from) from.focus();
  }
  for (var i = 0; i < openers.length; i++) openers[i].addEventListener('click', function (e) {
    e.stopPropagation(); set(sheet.hidden, this);
  });
  sheet.querySelector('[data-wx-close]').addEventListener('click', function () { set(false, openers[0]); });
  sheet.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!sheet.hidden) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) set(false, openers[0]); });
})();
</script>
