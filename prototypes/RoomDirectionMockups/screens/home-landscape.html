<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home, iPhone sideways</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/room.css">
<link rel="stylesheet" href="../css/soft.css">
<style>
  /* Home on an iPhone held sideways (844 x 390). The room is not squashed into the short frame: it is drawn as a
     closer view at 0.72 (the wardrobe, window, sign, desk, suitcase, hamper and Maya) on the left, and the same
     controls sit beside it as soft tiles on the right, in the room's order. The objects in the room still lead
     where they do on the upright phone. */
  body { background: var(--wall); }
  a, button { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }
  .screen { height: 100vh; min-height: 360px; }
  .room { --floor-y: 290px; }
  .art { position: absolute; display: block; }
  .ic svg { width: 1em; height: 1em; display: block; }

  /* ---------- the room, left ---------- */
  .scene { position: absolute; left: max(0px, calc(50% - 422px)); top: 0; width: 430px; height: 390px; overflow: hidden; }
  .obj { position: absolute; display: block; border-radius: 10px; }
  .obj > .art { left: 0; top: 0; width: 100%; height: 100%; }
  .scene .rail { position: absolute; overflow: hidden; }
  .scene .rail .g { position: absolute; }
  .sign .name { position: absolute; display: flex; align-items: center; justify-content: center;
                font-family: var(--font-display); font-weight: 700; font-style: italic; color: var(--plum); letter-spacing: .2px; }
  .lap { position: absolute; display: grid; place-items: center; color: #fff; font-size: 17px; border-radius: 3px; }
  .hamper.off > .art { filter: saturate(.4) brightness(1.1) contrast(.8); }
  .glow { position: absolute; left: 348px; top: 108px; width: 96px; height: 96px; border-radius: 50%; pointer-events: none; display: none;
          background: radial-gradient(closest-side, rgba(255,228,150,.55), rgba(255,228,150,0)); }
  html.is-night .glow, html.theme-dark .glow { display: block; }
  .maya, .maya-zzz { pointer-events: none; }
  .maya-zzz { animation: mayaZ 7s ease-in-out infinite; }
  @keyframes mayaZ { 0%, 100% { transform: translate(0, 0); opacity: 1; } 50% { transform: translate(1px, -2px); opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { .maya-zzz { animation: none; } }

  /* ---------- the controls, right ---------- */
  .side { position: absolute; top: 0; bottom: 0; left: calc(max(0px, calc(50% - 422px)) + 430px); right: 0; padding: 8px 20px 0 18px;
          background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5) 18px); }
  .side-in { max-width: 384px; }
  .hd { display: flex; align-items: center; height: 44px; }
  .hd .title-display { font-size: 25px; letter-spacing: -.4px; }
  .hd .prof { margin-left: auto; width: 44px; height: 44px; display: grid; place-items: center; color: var(--plum); font-size: 26px; border-radius: 12px; margin-right: -8px; }
  .wx { display: inline-flex; align-items: center; gap: 4px; height: 44px; margin-left: -4px; padding: 0 4px; border-radius: 12px;
        color: var(--plum); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .wx .ic { font-size: 18px; display: grid; }
  .wx .chev { font-size: 13px; display: grid; }
  .wx .sim { margin-left: 4px; }

  .tiles { display: flex; gap: 8px; margin-top: 4px; }
  .tile { flex: 1 1 0; min-width: 0; display: flex; align-items: flex-start; gap: 9px; min-height: 74px; padding: 9px 10px 9px 12px; border-radius: 22px;
          background: rgba(255,255,255,.68); box-shadow: var(--soft-drop); color: var(--ink); }
  .tile.butter { background: #FCF0C6; }
  .tile > i[data-icon] { font-size: 21px; color: var(--plum); flex: none; margin-top: 2px; }
  .tile .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .tile small { font-size: 11px; line-height: 14px; color: var(--ink-soft); }
  .tile b { font-size: 15px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .end { color: var(--soft-chev); font-size: 13px; display: grid; align-self: center; }
  .pill { display: inline-flex; align-self: flex-start; align-items: center; gap: 4px; margin-top: 4px; padding: 1px 8px 1px 6px; border-radius: 999px;
          background: #E2F2DD; font-size: 12px; font-weight: 600; line-height: 18px; color: #2F5536; white-space: nowrap; }
  .pill i[data-icon] { font-size: 12px; color: #3E6B45; }
  .pill.main { background: rgba(255,255,255,.8); color: var(--ink-soft); }
  .pill.butter { background: #FCF0C4; color: #5E4A0E; }

  .go { margin-top: 10px; min-height: 48px; }
  .more { display: flex; gap: 6px; margin-top: 10px; }
  .more a { display: flex; align-items: center; justify-content: center; gap: 5px; height: 44px; padding: 0 11px; border-radius: 16px;
            background: rgba(255,255,255,.62); box-shadow: var(--soft-drop); font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .more a i[data-icon] { font-size: 17px; color: var(--plum); }
  .more .lau { flex: 1.25 1 0; justify-content: flex-start; padding-left: 10px; }
  .more .lau .t { display: flex; flex-direction: column; line-height: 1.1; }
  .more .lau small { font-size: 11px; font-weight: 500; color: var(--ink-soft); }
  .more .lau b { font-size: 14px; }
  .more .lau.off b { color: var(--ink-soft); font-weight: 600; }
  .more .dr { flex: 1 1 auto; }

  /* tab bar under the controls */
  .tabbar { left: auto; right: 20px; width: 384px; bottom: 10px; height: 56px; border-radius: 28px; padding: 5px; }
  .tabbar > a { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px; border-radius: 23px;
                font-size: 14px; font-weight: 600; color: var(--plum); }
  .tabbar > a i[data-icon] { font-size: 21px; }
  .tabbar > a.on { background: var(--plum); color: #fff; }
  .tabfade { display: none; }

  /* weather detail sheet */
  .wxsheet { position: absolute; top: 96px; width: 300px; z-index: 30; padding: 4px 4px 14px 16px; background: #fff; border-radius: 22px;
             box-shadow: 0 22px 30px -18px rgba(90,42,74,.42), 0 2px 24px rgba(90,42,74,.08); }
  .wxsheet[hidden] { display: none; }
  .wxsheet .wh { display: flex; align-items: center; gap: 6px; min-height: 44px; }
  .wxsheet .wh .ic { font-size: 19px; color: var(--plum); display: grid; }
  .wxsheet .wh b { font-size: 15px; }
  .wxsheet .x { margin-left: auto; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-soft); font-size: 17px; }
  .wxsheet .big { font-size: 17px; font-weight: 700; line-height: 1.25; }
  .wxsheet .say { margin-top: 4px; padding-right: 10px; font-size: 13px; line-height: 1.35; color: var(--ink-soft); }
  .wxsheet .say a { color: var(--plum); font-weight: 600; }

  /* dark appearance (tokens from css/dark.css) */
  html.theme-dark .side { background: linear-gradient(90deg, rgba(58,42,51,0), rgba(58,42,51,.7) 18px); }
  html.theme-dark .tile, html.theme-dark .more a { background: var(--surface); }
  html.theme-dark .tile.butter { background: var(--tint-butter); }
  html.theme-dark .pill { background: var(--tint-green); color: var(--tint-green-ink); }
  html.theme-dark .pill i[data-icon] { color: var(--tint-green-ink); }
  html.theme-dark .pill.main { background: rgba(255,240,248,.1); color: var(--ink-soft); }
  html.theme-dark .pill.butter { background: var(--tint-butter); color: var(--tint-butter-ink); }
  html.theme-dark .sign .name { color: #5A1A4B; }
  html.theme-dark .wxsheet { background: var(--surface); }
  html.theme-dark .hamper.off > .art { filter: brightness(.6) saturate(.4) contrast(.85); }
</style>
</head>
<body>
<div class="screen">
  <div class="room"></div>

  <!-- ============ the room at 0.72, floor line 290 ============ -->
  <div class="scene">
    <img class="art" src="../art/rug.svg" alt="" style="left:70px;top:300px;width:224.6px;height:109.4px">
    <!-- wardrobe (wardrobe.svg 164 x 394 at 0.72): opening x 25.3..116, rail at y 87.3 -->
    <a class="obj" href="closet.html" tabindex="-1" aria-label="Wardrobe. Opens Closet" style="left:8px;top:6px;width:118.1px;height:283.7px">

    <!-- desk (home-desk.svg at 0.72): slab top 183.4, drawer fronts x 349..406 at y 193.5, 226.6, 259.8 -->

    <img class="art maya" src="../art/maya.svg" alt="" aria-hidden="true" style="left:170px;top:326px;width:79.2px;height:43.2px">
    <img class="art maya-zzz" src="../art/maya-zzz.svg" alt="" aria-hidden="true" style="left:192px;top:306px;width:28.8px;height:28.8px">
    <a class="obj" href="suitcases.html" tabindex="-1" aria-label="Suitcase. Opens Suitcases" style="left:112px;top:168px;width:74.9px;height:131px">

  </div>

  <!-- ============ the controls ============ -->
  <div class="side">

        </a>

    <p class="big" id="wxs-big">58°F · Rain today</p>

  <div class="tabfade"></div>
  <nav class="tabbar" aria-label="Tabs">

    <a href="closet.html"><i data-icon="hanger"></i>Closet</a>
    <a href="saved.html"><i data-icon="bookmark"></i>Saved Looks</a>
  </nav>
</div>

<script src="../js/icons.js"></script>
<script src="../js/garments.js"></script>
<script src="../js/mock-state.js"></script>
<script>
/* ---------- Home state (same rules as home.html) ----------
   ?weather=rain|sun|cloudy|snow, ?time=night, ?laundry=off|clean override stored state for display.
   Source from MockState `source` (default Jose's house), Occasion from `occasion` (default Office). */
var HOME = (function () {
  var P = new URLSearchParams(location.search);
  var S = window.MockState || { get: function (k, f) { return f; }, set: function () {} };
  var SUITCASES = { jose: { name: "Jose's house", n: 5 }, weekend: { name: 'Weekend', n: 8 }, spring: { name: 'Spring trip', n: 0 } };
  var OCC = { office: 'Office', dateNight: 'Date Night', brunch: 'Brunch', concert: 'Concert', casual: 'Casual', event: 'Event', other: 'Other' };
  var WX = {
    rain:   { icon: 'rain',  art: 'window-rain',   t: 58, tn: 54, day: 'Rain today',   night: 'Rain tonight',   say: 'Style Me picks looks for a cool, wet day.' },
    sun:    { icon: 'sun',   art: 'window-sun',    t: 72, tn: 61, day: 'Sunny today',  night: 'Clear tonight',  say: 'Style Me picks looks for a mild, sunny day.', nicon: 'moon' },
    cloudy: { icon: 'cloud', art: 'window-cloudy', t: 63, tn: 57, day: 'Cloudy today', night: 'Cloudy tonight', say: 'Style Me picks looks for a mild, cloudy day.' },
    snow:   { icon: 'snow',  art: 'window-snow',   t: 30, tn: 26, day: 'Snow today',   night: 'Snow tonight',   say: 'Style Me picks warm looks for a cold, snowy day.' }
  };
  if (S.get('source', null) === null) S.set('source', { type: 'suitcase', id: 'jose' });
  var wkey = WX[P.get('weather')] ? P.get('weather') : 'rain';
  var night = P.get('time') === 'night';
  var w = WX[wkey];
  var weather = { key: wkey, night: night, art: night ? 'window-night' : w.art, icon: night && w.nicon ? w.nicon : w.icon,
    temp: (night ? w.tn : w.t) + '°F', words: night ? w.night : w.day, say: night ? w.say.replace(' day.', ' evening.') : w.say };
  weather.text = weather.temp + ' · ' + weather.words;
  if (night) document.documentElement.classList.add('is-night');
  var lp = P.get('laundry');
  var tracking = lp === 'off' ? false : (lp === 'clean' ? true : S.get('laundry.tracking', true) !== false);
  var dirty = lp === 'clean' ? [] : (S.get('laundry.dirty', ['g-lace-top', 'g-black-tee']) || []);
  var laundry = !tracking
    ? { state: 'off', text: 'Off', href: 'laundry-off.html', label: 'Laundry tracking is off. Opens what laundry tracking does' }
    : dirty.length
      ? { state: 'dirty', n: dirty.length, text: dirty.length + ' to wash', href: 'laundry.html', label: 'Laundry: ' + dirty.length + ' to wash. Opens Laundry' }
      : { state: 'clean', text: 'All clean', href: 'laundry.html', label: 'Laundry: all clean. Opens Laundry' };
  var src = S.get('source', { type: 'suitcase', id: 'jose' }) || {};
  var sid = String(src.id || '').replace(/^s-/, '');
  var source = src.type === 'suitcase' && SUITCASES[sid]
    ? { suitcase: true, name: SUITCASES[sid].name, n: SUITCASES[sid].n }
    : { suitcase: false, name: 'Main closet', n: 21 };
  source.count = source.n === 0 ? 'Empty' : source.n + (source.n === 1 ? ' piece' : ' pieces');
  source.scope = source.suitcase ? 'Suitcase only' : 'Whole closet';
  source.label = 'Source: ' + source.name + ', ' + (source.n === 0 ? 'empty' : source.count) + ', ' + source.scope.toLowerCase() + '. Opens Suitcases';
  var ok = S.get('occasion', 'office');
  var occasion = OCC[ok] || 'Office';
  var occasionLong = ok === 'other' && S.get('occasionOther', '') ? 'Other: ' + S.get('occasionOther', '') : occasion;
  var SNOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.6 4.6 12 6.6l2.4-2M9.6 19.4 12 17.4l2.4 2M4.6 11.1l2.9-.6-.9-2.9M19.4 11.1l-2.9-.6.9-2.9M4.6 12.9l2.9.6-.9 2.9M19.4 12.9l-2.9.6.9 2.9"/></svg>';
  function icon(name) { return name === 'snow' ? SNOW : (window.Icons ? window.Icons.svg(name) : ''); }
  function txt(id, t) { var e = document.getElementById(id); if (e) e.textContent = t; }
  return { weather: weather, laundry: laundry, source: source, occasion: occasion, occasionLong: occasionLong, icon: icon, txt: txt };
})();

/* ---------- this page ---------- */
(function () {
  var H = HOME, w = H.weather, l = H.laundry, s = H.source;
  document.getElementById('window').src = '../art/' + w.art + '.svg';
  document.getElementById('wx-ic').innerHTML = H.icon(w.icon);
  document.getElementById('wxs-ic').innerHTML = H.icon(w.icon);
  H.txt('wx-text', w.text); H.txt('wxs-big', w.text); H.txt('wxs-say', w.say);
  document.getElementById('wx').setAttribute('aria-label', 'Weather: ' + w.text + '. Simulated');

  H.txt('src-name', s.name);
  H.txt('src-scope', s.count + ' · ' + s.scope);
  document.getElementById('src-pill').className = 'pill' + (s.suitcase ? (s.n === 0 ? ' butter' : '') : ' main');
  if (!s.suitcase) document.querySelector('#src-pill i').style.display = 'none';
  document.getElementById('row-source').setAttribute('aria-label', s.label);
  H.txt('occ', H.occasionLong);
  document.getElementById('row-occ').setAttribute('aria-label', 'Occasion: ' + H.occasionLong + '. Change');

  var row = document.getElementById('row-laundry');
  row.setAttribute('href', l.href); row.setAttribute('aria-label', l.label);
  row.classList.toggle('off', l.state === 'off');
  H.txt('lau-text', l.text);
  var ham = document.getElementById('hamper');
  ham.classList.add(l.state); ham.setAttribute('href', l.href); ham.setAttribute('aria-label', l.label);
  document.getElementById('hamper-art').src = '../art/' + (l.state === 'dirty' ? 'home-hamper-dirty' : 'home-hamper') + '.svg';

  /* the weather sheet opens under the weather link */
  document.getElementById('wx-sheet').style.left = (document.getElementById('wx').getBoundingClientRect().left) + 'px';
})();

/* Weather sheet: the weather link opens it; the close button, Escape or a tap outside closes it. */
(function () {
  var sheet = document.getElementById('wx-sheet'), opener = document.getElementById('wx');
  function set(open, refocus) {
    sheet.hidden = !open;
    opener.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) document.getElementById('wx-close').focus(); else if (refocus) opener.focus();
  }
  opener.addEventListener('click', function (e) { e.stopPropagation(); set(sheet.hidden, true); });
  document.getElementById('wx-close').addEventListener('click', function () { set(false, true); });
  sheet.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!sheet.hidden) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) set(false, true); });
})();
</script>
</body>
