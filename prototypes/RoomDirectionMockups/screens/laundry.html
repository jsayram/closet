<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/room.css">
<link rel="stylesheet" href="../css/soft.css">
<style>
  /* Laundry. A small laundry corner (shelf, washer, hamper, plant) sits beside the title, like the small wardrobe on
     Closet; the hamper shows what is still dirty. Below it on the floor: which clothes (Main closet or the suitcase
     Style Me is using), the pieces in the wash, and the two bulk actions. Bulk cleaning asks first; every clean can be
     undone from the toast. The column is at most 430 wide and centred, so a wider frame (iPad Split View) lets the
     room breathe instead of stretching it. The page scrolls; the tab bar stays fixed.
     Variants: ?confirm=all (confirmation sheet open), ?undo=1 (just cleaned, Undo offered), ?laundry=off. */
  :root { --fy: 196px; }
  html, body { background: var(--floor-2); }
  a, button { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  .screen { height: auto; min-height: 100vh; overflow: visible; padding-bottom: 128px;
    background: linear-gradient(var(--floor-line), var(--floor-line)) 0 var(--fy) / 100% 2px no-repeat,
                linear-gradient(var(--floor), var(--floor-2) 520px) 0 var(--fy) / 100% 100% no-repeat,
                linear-gradient(var(--wall), var(--wall-2)) 0 0 / 100% var(--fy) no-repeat; }
  .col { position: relative; max-width: 430px; margin: 0 auto; }
  .art { position: absolute; display: block; pointer-events: none; }

  /* nav and header */
  .nav { z-index: 5; }
  .nav .back { position: absolute; left: 4px; top: 2px; height: 44px; padding: 0 10px 0 4px; display: flex; align-items: center; gap: 2px;
               color: var(--plum); font-size: 17px; font-weight: 500; }
  .nav .back i[data-icon] { font-size: 24px; }
  .head { position: relative; height: var(--fy); }
  .hdr { position: absolute; left: 20px; top: 46px; display: flex; flex-direction: column; gap: 6px; }
  .hdr .count { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--ink-soft); }

  /* the corner, drawn at its home scale and shown at half size. Inner box = art x 34..358, y 120..415 of the old
     full-size corner; floor line (inner y 276) lands on --fy. */
  .corner { position: absolute; right: 12px; top: 58px; width: 324px; height: 295px; transform-origin: 100% 0; transform: scale(.5);
            pointer-events: none; }
  .corner.off .hamper { opacity: .55; }

  /* body */
  .body { padding: 14px 16px 0; }
  .scope { display: flex; gap: 8px; flex-wrap: wrap; }
  .scope button { min-height: 44px; display: flex; align-items: center; }
  .scope .chip { font-size: 14px; min-height: 36px; }
  .scope .chip i[data-icon] { font-size: 16px; }
  .scope .chip:not(.on) i[data-icon] { color: var(--plum); }
  .scope .chip .n { font-weight: 700; opacity: .8; }
  .scope-note { margin-top: 2px; font-size: 13px; line-height: 17px; color: var(--ink-soft); }

  .hint { margin-top: 12px; font-size: 13px; line-height: 17px; color: var(--ink-soft); padding-left: 2px; }
  .list { margin-top: 4px; list-style: none; }
  .item { position: relative; display: flex; align-items: center; gap: 6px; min-height: 80px; padding: 4px 0; }
  .item + .item::before { content: ""; position: absolute; left: 50px; right: 8px; top: 0; height: 1px; background: var(--soft-divider); }
  .sel { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; }
  .sel .dot { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: inset 0 0 0 2px #DCC7D3, 0 6px 9px -6px rgba(90,42,74,.45);
              display: grid; place-items: center; color: transparent; }
  .sel .dot i[data-icon] { font-size: 16px; }
  .sel .dot i[data-icon] svg { stroke-width: 2.6; }
  .sel[aria-checked="true"] .dot { background: var(--plum); color: #fff; box-shadow: 0 6px 9px -6px rgba(79,21,65,.7); }
  .thumb { position: relative; width: 58px; height: 72px; flex: none; }
  .stk { position: absolute; left: 6px; top: 0; width: 46px; display: block;
         filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
                 drop-shadow(1.4px 1.4px 0 #fff) drop-shadow(-1.4px -1.4px 0 #fff) drop-shadow(1.4px -1.4px 0 #fff) drop-shadow(-1.4px 1.4px 0 #fff)
                 drop-shadow(0 5px 6px rgba(110,58,82,.18)); }
  .stk.r1 { transform: rotate(-4deg); } .stk.r2 { transform: rotate(3deg); }
  .item .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .item b { font-size: 16px; line-height: 20px; font-weight: 700; }
  .item small { font-size: 13px; line-height: 17px; color: var(--ink-soft); }
  .mark { height: 44px; display: grid; place-items: center; flex: none; }
  .mark .chip { min-height: 36px; padding: 6px 12px 6px 10px; color: var(--plum); background: rgba(255,255,255,.75); }
  .mark .chip i[data-icon] { font-size: 15px; }

  .empty { margin-top: 18px; display: flex; gap: 12px; align-items: flex-start; padding: 4px 4px 4px 2px; }
  .empty .ok { width: 34px; height: 34px; border-radius: 50%; background: #E2F2DD; color: #355E3C; display: grid; place-items: center; flex: none; }
  .empty .ok i[data-icon] { font-size: 19px; }
  .empty b { display: block; font-size: 16px; line-height: 21px; }
  .empty p { font-size: 14px; line-height: 19px; color: var(--ink-soft); margin-top: 2px; }

  .acts { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acts .btn { min-height: 58px; padding: 6px 10px; flex-direction: column; gap: 0; line-height: 1.15; text-align: center; }
  .acts .btn b { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .acts .btn b i[data-icon] { font-size: 18px; }
  .acts .btn small { font-size: 12px; font-weight: 600; opacity: .85; }
  .acts .btn.ghost { background: rgba(255,255,255,.75); }
  .acts .btn:disabled { background: rgba(255,255,255,.45); color: #9C8794; box-shadow: none; }
  .acts .btn.plum:disabled { background: #DCC6D4; color: #fff; }
  .fine { margin-top: 14px; display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; line-height: 18px; color: var(--ink-soft); }
  .fine i[data-icon] { font-size: 17px; color: var(--plum); margin-top: 1px; }

  /* tracking off, inline */
  .off { margin-top: 4px; }
  .off h2 { font-size: 18px; line-height: 23px; font-weight: 700; }
  .off p { margin-top: 6px; font-size: 15px; line-height: 21px; color: var(--ink); }
  .off p.soft { color: var(--ink-soft); font-size: 14px; line-height: 19px; }
  .off .row2 { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .off .row2 .btn { min-height: 50px; font-size: 16px; }
  .off .row2 .btn.ghost { background: rgba(255,255,255,.75); }
  .link-row { margin-top: 12px; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--plum); font-weight: 600; font-size: 15px; }
  .link-row i[data-icon] { font-size: 15px; }

  /* undo toast, just above the tab bar */
  .toast { position: fixed; left: max(16px, calc(50% - 199px)); right: max(16px, calc(50% - 199px)); bottom: 96px; z-index: 30; min-height: 54px;
           display: flex; align-items: center; gap: 9px; padding: 5px 5px 5px 14px; background: var(--ink); color: #fff; border-radius: 20px;
           box-shadow: 0 16px 22px -14px rgba(43,27,39,.6); }
  .toast[hidden] { display: none; }
  .toast .ok { width: 24px; height: 24px; border-radius: 50%; background: #B7D5B1; color: var(--ink); display: grid; place-items: center; flex: none; }
  .toast .ok i[data-icon] { font-size: 14px; }
  .toast .ok i[data-icon] svg { stroke-width: 2.6; }
  .toast .msg { font-size: 14px; line-height: 18px; font-weight: 600; flex: 1; min-width: 0; }
  .toast .undo { height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 5px; border-radius: 14px;
                 color: #F8C6D3; font-size: 15px; font-weight: 700; flex: none; }
  .toast .undo i[data-icon] { font-size: 17px; }
  .toast .undo:focus-visible { outline-color: #F8C6D3; }

  /* confirmation sheet */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(43,27,39,.34); }
  .scrim[hidden], .sheet[hidden] { display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0 auto; max-width: 507px; padding: 10px 20px 30px;
           background: #FFF8F5; border-radius: 30px 30px 0 0; box-shadow: 0 -12px 30px -10px rgba(90,42,74,.3); }
  .sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: #E6D5DE; margin: 0 auto 14px; }
  .sheet h2 { font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1.15; letter-spacing: -.3px; }
  .sheet .scope-line { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--plum);
                       background: var(--plum-soft); border-radius: 999px; padding: 5px 12px 5px 9px; }
  .sheet .scope-line i[data-icon] { font-size: 16px; }
  .sheet p { margin-top: 10px; font-size: 15px; line-height: 21px; }
  .sheet .pile { display: flex; gap: 14px; margin: 14px 0 4px; flex-wrap: wrap; }
  .sheet .pc { display: flex; flex-direction: column; align-items: center; width: 84px; text-align: center; }
  .sheet .pc .thumb { width: 58px; height: 74px; }
  .sheet .pc span.nm { margin-top: 2px; font-size: 13px; line-height: 16px; font-weight: 600; }
  .sheet .btns { margin-top: 18px; display: grid; gap: 10px; }
  .sheet .btn.ghost { background: rgba(106,31,88,.07); box-shadow: none; }

  /* tab bar, fixed */
  .tabfade { position: fixed; z-index: 10; --tabfade: var(--floor-2); }
  .tabbar { position: fixed; z-index: 11; left: max(14px, calc(50% - 181px)); right: max(14px, calc(50% - 181px)); }
  .tabbar > a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px;
                font-size: 12px; font-weight: 600; color: var(--plum); }
  .tabbar > a i[data-icon] { font-size: 23px; }
  .tabbar > a.on { background: var(--plum); color: #fff; }
</style>
<link rel="stylesheet" href="../css/tablet-layout.css?v=centered-r11">
</head>
<body>
<div class="screen">
  <div class="col">
    <div class="head">
      <!-- the laundry corner, decorative; the hamper art follows what is still in the wash -->
      <div class="corner" id="corner" aria-hidden="true">
        <img class="art" src="../art/travel-laundry-shelf.svg" alt="" style="left:4px;top:0;width:224px;height:76px">
        <img class="art" src="../art/travel-washer.svg" alt="" style="left:0;top:115.7px;width:123.2px;height:173.8px">
        <img class="art hamper" id="hamper" src="../art/travel-hamper.svg" alt="" style="left:135px;top:167px;width:96.8px;height:127.6px">
        <img class="art" src="../art/plant-floor.svg" alt="" style="left:252px;top:164px;width:72px;height:124px">
      </div>
      <div class="nav">
        <a class="back" href="closet.html"><i data-icon="chevron-left"></i>Closet</a>
        <a class="right" href="settings.html" aria-label="Profile and settings"><i data-icon="person-circle"></i></a>
      </div>
      <div class="hdr"><h1 class="title-display">Laundry</h1><span class="count" id="count" aria-live="polite">2 pieces<br>in the wash</span></div>
    </div>

    <main class="body" id="body"></main>
  </div>

  <div class="toast" id="toast" role="status" hidden>
    <span class="ok"><i data-icon="check"></i></span>
    <span class="msg" id="toastMsg"></span>
    <button class="undo" type="button" id="undo"><i data-icon="undo"></i>Undo</button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheetTitle">Mark 2 pieces clean?</h2>
    <div class="scope-line" id="sheetScope"><i data-icon="hanger"></i>Main closet</div>
    <p id="sheetText">Everything in the wash here becomes available to Style Me again.</p>
    <div class="pile" id="sheetPile"></div>
    <div class="btns">
      <button class="btn" type="button" id="sheetGo"><i data-icon="check"></i>Mark 2 clean</button>
      <button class="btn ghost" type="button" id="sheetCancel">Cancel</button>
    </div>
  </div>

  <div class="tabfade"></div>
  <nav class="tabbar" aria-label="Tabs">
    <a href="home.html"><i data-icon="home"></i>Home</a>
    <a class="on" href="closet.html" aria-current="page"><i data-icon="hanger"></i>Closet</a>
    <a href="saved.html"><i data-icon="bookmark"></i>Saved Looks</a>
  </nav>
</div>

<script src="../js/icons.js"></script>
<script src="../js/garments.js"></script>
<script src="../js/mock-state.js"></script>
<script>
(function () {
  var P = new URLSearchParams(location.search);
  var DEFAULT_DIRTY = ['g-lace-top', 'g-black-tee'];
  var DEFAULT_MEMBERS = {
    jose: ['g-navy-trousers', 'g-pink-blouse', 'g-navy-cardigan', 'g-nude-flats', 'g-lace-top'],
    weekend: ['g-navy-trousers', 'g-olive-trousers', 'g-wide-jeans', 'g-brick-top', 'g-cream-sweater', 'g-brown-jacket', 'g-white-sneakers', 'g-black-tee'],
    spring: []
  };
  var SUIT_NAMES = { jose: "Jose's house", weekend: 'Weekend', spring: 'Spring trip' };
  var KIND = { top: 'Top', layer: 'Layer', bottom: 'Bottom', dress: 'Dress', shoes: 'Shoes', accessory: 'Bag' };
  var G = {};
  Garments.LIST.forEach(function (g) { G[g.id] = g; });

  function sid(s) { return String(s || '').replace(/^s-/, ''); }
  var members = MockState.get('suitcases.members', DEFAULT_MEMBERS);
  var names = MockState.get('suitcases.names', {});
  function suitName(id) { return names[id] || SUIT_NAMES[id] || id; }
  var src = MockState.get('source', { type: 'suitcase', id: 'jose' });
  var srcId = src && src.type === 'suitcase' ? sid(src.id) : null;
  if (srcId && !members[srcId]) srcId = null;

  // what the variant shows; the URL wins over stored state
  var tracking = P.get('laundry') === 'off' ? false : P.get('laundry') === 'on' ? true : MockState.get('laundry.tracking', true);
  var dirty = (MockState.get('laundry.dirty', DEFAULT_DIRTY) || []).slice();
  var scope = P.get('scope') === 'suitcase' && srcId ? srcId : 'main';
  var selected = [];
  var lastCleaned = [];
  if (P.get('undo') === '1') { dirty = []; lastCleaned = DEFAULT_DIRTY.slice(); }

  var body = document.getElementById('body');
  var toast = document.getElementById('toast');

  function save() { MockState.set('laundry.dirty', dirty.slice()); }
  function inScope(id) { return scope === 'main' || (members[scope] || []).indexOf(id) >= 0; }
  function scoped() { return dirty.filter(inScope); }
  function scopeName() { return scope === 'main' ? 'Main closet' : suitName(scope); }
  function where(id) {
    var list = Object.keys(members).filter(function (k) { return members[k].indexOf(id) >= 0; }).map(suitName);
    return list.length ? 'packed in ' + list.join(' and ') : 'in your closet';
  }
  function plural(n) { return n === 1 ? '1 piece' : n + ' pieces'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function sticker(id, i) { return '<span class="thumb"><span class="stk r' + (i % 2 + 1) + '" data-garment="' + id + '" data-detail="high"></span></span>'; }

  function hamperArt() {
    var lace = dirty.indexOf('g-lace-top') >= 0, tee = dirty.indexOf('g-black-tee') >= 0, other = dirty.length - (lace ? 1 : 0) - (tee ? 1 : 0) > 0;
    if (!tracking) return 'travel-hamper-empty';
    if ((lace && tee) || other) return 'travel-hamper';
    return lace ? 'travel-hamper-lace' : tee ? 'travel-hamper-tee' : 'travel-hamper-empty';
  }

  function render() {
    document.getElementById('hamper').src = '../art/' + hamperArt() + '.svg';
    document.getElementById('corner').classList.toggle('off', !tracking);
    var count = document.getElementById('count');
    if (!tracking) { count.innerHTML = 'Tracking off'; body.innerHTML = offHTML(); wireOff(); mount(); return; }
    count.innerHTML = dirty.length ? plural(dirty.length) + '<br>in the wash' : 'Nothing<br>in the wash';
    selected = selected.filter(function (id) { return scoped().indexOf(id) >= 0; });

    var h = '';
    if (srcId) {
      h += '<div class="scope" role="radiogroup" aria-label="Which clothes">' +
        scopeChip('main', 'hanger', 'Main closet', dirty.length) +
        scopeChip(srcId, 'suitcase', suitName(srcId), dirty.filter(function (id) { return members[srcId].indexOf(id) >= 0; }).length) + '</div>' +
        '<p class="scope-note">' + (scope === 'main' ? 'Every piece you own, packed or not.' : esc(suitName(srcId)) + ' is your Style Me source. Only what is packed in it.') + '</p>';
    }
    var list = scoped();
    if (list.length) {
      if (list.length > 1) h += '<p class="hint">Tick the circles to clean a few together.</p>';
      h += '<ul class="list" aria-label="Pieces in the wash">';
      list.forEach(function (id, i) {
        var g = G[id] || { name: id, category: 'top' }, on = selected.indexOf(id) >= 0;
        h += '<li class="item" data-id="' + id + '">' +
          '<button class="sel" type="button" role="checkbox" aria-checked="' + on + '" aria-label="Select ' + esc(g.name) + '"><span class="dot"><i data-icon="check"></i></span></button>' +
          sticker(id, i) +
          '<span class="txt"><b>' + esc(g.name) + '</b><small>' + (KIND[g.category] || 'Piece') + ' · ' + esc(where(id)) + '</small></span>' +
          '<button class="mark" type="button" aria-label="Mark ' + esc(g.name) + ' clean"><span class="chip"><i data-icon="check"></i>Mark clean</span></button></li>';
      });
      h += '</ul>';
    } else {
      h += '<div class="empty"><span class="ok"><i data-icon="check"></i></span><div><b>Nothing in the wash' + (scope === 'main' ? '' : ' in ' + esc(scopeName())) + '</b>' +
        '<p>Every piece here counts as available to Style Me.</p></div></div>';
    }
    var n = list.length;
    if (n) h += '<div class="acts">' +
      '<button class="btn ghost" type="button" id="cleanSel"' + (selected.length ? '' : ' disabled') + '><b><i data-icon="check"></i>Clean selected</b><small>' +
        (selected.length ? selected.length + ' selected' : 'None selected') + '</small></button>' +
      '<button class="btn plum" type="button" id="cleanAll"' + (n ? '' : ' disabled') + '><b>Mark all clean</b><small>' + esc(scopeName()) + ' · ' + plural(n) + '</small></button>' +
      '</div>';
    h += '<p class="fine"><i data-icon="info"></i><span>Style Me skips pieces in the wash unless you allow one. Shared pieces have one status, so cleaning one cleans it everywhere.</span></p>';
    body.innerHTML = h;
    wire();
    mount();
  }
  function scopeChip(key, icon, label, n) {
    var on = scope === key;
    return '<button type="button" role="radio" aria-checked="' + on + '" data-scope="' + key + '"><span class="chip' + (on ? ' on' : '') + '"><i data-icon="' + icon + '"></i>' +
      esc(label) + ' <span class="n">· ' + n + '</span></span></button>';
  }
  function offHTML() {
    var n = dirty.length;
    return '<div class="off"><h2>Laundry tracking is off</h2>' +
      '<p>Every piece counts as available to Style Me.</p>' +
      (n ? '<p class="soft">' + (n === 1 ? 'The 1 piece' : 'The ' + n + ' pieces') + ' you marked as in the wash are kept. Turn tracking on and they come back.</p>' : '') +
      '<div class="row2"><button class="btn" type="button" id="turnOn">Turn on</button>' +
      '<a class="btn ghost" href="laundry-off.html">What it does</a></div>' +
      '<a class="link-row" href="settings.html?laundry=off">You can change this in Profile<i data-icon="chevron-right"></i></a></div>';
  }
  function wireOff() {
    document.getElementById('turnOn').addEventListener('click', function () {
      tracking = true; MockState.set('laundry.tracking', true); render();
    });
  }
  function mount() { Icons.mountAll(body); Garments.mountAll(body); }

  function clean(ids, text) {
    if (!ids.length) return;
    dirty = dirty.filter(function (id) { return ids.indexOf(id) < 0; });
    selected = selected.filter(function (id) { return ids.indexOf(id) < 0; });
    lastCleaned = ids.slice(); save(); render();
    showToast(text || (ids.length === 1 ? (G[ids[0]] || {}).name + ' marked clean' : plural(ids.length) + ' marked clean'));
  }
  function showToast(text) { document.getElementById('toastMsg').textContent = text; toast.hidden = false; }
  document.getElementById('undo').addEventListener('click', function () {
    lastCleaned.forEach(function (id) { if (dirty.indexOf(id) < 0) dirty.push(id); });
    dirty.sort(function (a, b) { return DEFAULT_DIRTY.indexOf(a) - DEFAULT_DIRTY.indexOf(b); });
    lastCleaned = []; save(); toast.hidden = true; render();
  });

  function wire() {
    Array.prototype.forEach.call(body.querySelectorAll('[data-scope]'), function (b) {
      b.addEventListener('click', function () { scope = b.getAttribute('data-scope'); selected = []; render(); });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.item'), function (it) {
      var id = it.getAttribute('data-id');
      it.querySelector('.sel').addEventListener('click', function () {
        var k = selected.indexOf(id);
        if (k >= 0) selected.splice(k, 1); else selected.push(id);
        render();
        var again = body.querySelector('.item[data-id="' + id + '"] .sel'); if (again) again.focus();
      });
      it.querySelector('.mark').addEventListener('click', function () { clean([id]); });
    });
    var sel = document.getElementById('cleanSel'), all = document.getElementById('cleanAll');
    if (sel) sel.addEventListener('click', function () {
      if (selected.length === 1) clean(selected.slice()); else openSheet('selected');
    });
    if (all) all.addEventListener('click', function () { openSheet('all'); });
  }

  // confirmation for bulk cleaning
  var sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim'), pending = [], opener = null;
  function openSheet(kind, quiet) {
    pending = kind === 'all' ? scoped() : selected.slice();
    if (!pending.length) return;
    opener = document.activeElement;
    var n = pending.length;
    document.getElementById('sheetTitle').textContent = n === 1 ? 'Mark ' + ((G[pending[0]] || {}).name || 'this piece') + ' clean?' : 'Mark ' + plural(n) + ' clean?';
    document.getElementById('sheetScope').innerHTML = '<i data-icon="' + (scope === 'main' ? 'hanger' : 'suitcase') + '"></i>' +
      (kind === 'all' ? 'Everything in the wash in ' : 'Selected in ') + esc(scopeName());
    document.getElementById('sheetText').textContent = (n === 1 ? 'It becomes' : 'They become') + ' available to Style Me again. You can undo this.';
    document.getElementById('sheetPile').innerHTML = pending.map(function (id, i) {
      return '<span class="pc">' + sticker(id, i) + '<span class="nm">' + esc((G[id] || {}).name || id) + '</span></span>';
    }).join('');
    document.getElementById('sheetGo').innerHTML = '<i data-icon="check"></i>Mark ' + n + ' clean';
    Icons.mountAll(sheet); Garments.mountAll(sheet);
    sheet.hidden = false; scrim.hidden = false;
    if (!quiet) document.getElementById('sheetGo').focus();
  }
  function closeSheet() { sheet.hidden = true; scrim.hidden = true; if (opener && opener.focus) opener.focus(); }
  document.getElementById('sheetCancel').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  document.getElementById('sheetGo').addEventListener('click', function () {
    var ids = pending.slice(); sheet.hidden = true; scrim.hidden = true; clean(ids);
  });

  ['', '-tee', '-lace', '-empty'].forEach(function (v) { new Image().src = '../art/travel-hamper' + v + '.svg'; });
  render();
  if (P.get('undo') === '1') showToast(plural(lastCleaned.length) + ' marked clean');
  if (P.get('confirm') === 'all' && tracking) openSheet('all', true);
  if (P.get('confirm') === 'selected' && tracking) { selected = scoped(); render(); openSheet('selected', true); }
})();
</script>
<script src="../js/tablet-layout.js?v=centered-r11"></script>
