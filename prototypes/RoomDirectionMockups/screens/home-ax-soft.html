<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Style Me, largest text (soft)</title>
<link rel="stylesheet" href="../css/room.css">
<style>
  /* Style Me at the largest accessibility text size. The room shrinks to a banner and the plates become rows,
     in the same order and colours. Body text about 1.6x: values 21-22 px, captions 15 px. */
  body { background: var(--wall); }
  .screen { background: linear-gradient(var(--wall), #FCEBEE 60%, var(--wall-2)); }
  a, button { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }

  .nav { height: 48px; font-size: 22px; }
  .nav .right { font-size: 30px; }
  .hdr-title { position: absolute; left: 16px; top: 50px; font-size: 38px; }

  /* banner: a close-up of the room against the wall (no floor in view), clipped to a card */
  .banner { position: absolute; left: 12px; top: 98px; width: 366px; height: 186px; border-radius: 22px; overflow: hidden;
            border: 1.5px solid #F0D3DB; background: linear-gradient(var(--wall), var(--wall-2)); }
  .banner .art { position: absolute; display: block; }
  .banner .rail { position: absolute; overflow: hidden; }
  .banner .rail .g { position: absolute; }
  /* her name sign on the wall: name-sign.svg with the first name as live text over its flat panel */
  .sign { position: absolute; display: block; }
  .sign img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .sign .name { position: absolute; display: flex; align-items: center; justify-content: center;
                font-family: var(--font-display); font-weight: 700; font-style: italic; color: var(--plum); letter-spacing: .2px; }
  .wxp { position: absolute; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0;
         min-height: 44px; padding: 5px 9px; border-radius: 14px; background: #fff; border: 1.5px solid var(--plate-line);
         box-shadow: 0 1px 0 #0000000d, 0 3px 8px #5a2a4a1a; white-space: nowrap; }
  .wxp .t { display: flex; align-items: center; gap: 5px; font-size: 21px; font-weight: 700; line-height: 1.15; }
  .wxp .t i[data-icon] { font-size: 22px; color: var(--plum); }
  .wxp .t i.chev { font-size: 16px; margin-left: 2px; }
  .wxp small { font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--ink-soft); }
  .wxp .sim { margin-top: 3px; font-size: 15px; line-height: 18px; padding: 0 8px; border-radius: 8px; background: #F8F2F6; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }

  /* rows */
  .rows-ax { position: absolute; left: 16px; right: 16px; top: 294px; display: flex; flex-direction: column; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: 18px; border: 1.5px solid var(--plate-line);
       background: #fff; box-shadow: 0 1px 0 #0000000a, 0 3px 8px #5a2a4a14; color: var(--ink); width: 100%; }
  .r > i[data-icon] { font-size: 28px; color: var(--plum); flex: none; align-self: flex-start; margin-top: 4px; }
  .r .txt { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; flex: 1; }
  .r small { font-size: 15px; line-height: 1.15; color: var(--ink-soft); font-weight: 500; }
  .r b { font-size: 22px; line-height: 1.15; font-weight: 700; }
  .r .end { margin-left: auto; flex: none; color: var(--plum); font-size: 22px; display: grid; }
  .r.green { background: #E4F3DF; border-color: #BFDDB8; }
  .r.butter { background: var(--butter); border-color: var(--butter-line); }
  .r.pink { background: #FCE6F2; border-color: #F0C4DC; }
  .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 3px 10px 3px 8px; border-radius: 999px;
          background: #E4F3DF; border: 1.5px solid #BFDDB8; font-size: 15px; font-weight: 600; line-height: 1.2; color: #2F5536; white-space: nowrap; }
  .pill i[data-icon] { font-size: 16px; color: #3E6B45; }
  .r .chip { min-height: 36px; padding: 0 14px 0 10px; gap: 6px; font-size: 20px; font-weight: 700; flex: none; }
  .r.one > i[data-icon] { align-self: center; margin-top: 0; }
  .r .chip i[data-icon] { font-size: 18px; }
  .r .hint { font-size: 15px; line-height: 1.2; color: var(--ink-soft); font-weight: 500; }

  /* actions */
  .go { position: absolute; left: 16px; right: 16px; top: 562px; min-height: 60px; border-radius: 18px; font-size: 22px; gap: 10px; }
  .go i[data-icon] { font-size: 26px; }
  .pair { position: absolute; left: 16px; right: 16px; top: 634px; display: flex; gap: 8px; }
  .sec { display: flex; align-items: center; justify-content: center; gap: 6px; height: 52px; padding: 0 12px; border-radius: 16px;
         border: 1.5px solid var(--plate-line); background: #fff; font-size: 20px; font-weight: 700; color: var(--ink); white-space: nowrap;
         box-shadow: 0 1px 0 #0000000a, 0 3px 8px #5a2a4a14; }
  .sec i[data-icon] { font-size: 22px; color: var(--plum); }
  .sec.butter { background: var(--butter); border-color: var(--butter-line); }

  /* weather detail sheet, opened in place by the banner's weather plate (no weather screen yet) */
  .wxsheet { position: absolute; left: 16px; right: 16px; top: 292px; z-index: 20; padding: 6px 6px 16px 18px;
             background: #fff; border: 1.5px solid var(--plate-line); border-radius: 20px; box-shadow: 0 10px 28px #5a2a4a38; }
  .wxsheet[hidden] { display: none; }
  .wxsheet .wh { display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .wxsheet .wh > i[data-icon] { font-size: 26px; color: var(--plum); }
  .wxsheet .wh b { font-size: 22px; }
  .wxsheet .wh .sim { font-size: 15px; line-height: 18px; padding: 1px 8px; }
  .wxsheet .x { margin-left: auto; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; color: var(--ink-soft); font-size: 24px; }
  .wxsheet .big { font-size: 24px; font-weight: 700; line-height: 1.25; }
  .wxsheet .say { margin-top: 6px; padding-right: 12px; font-size: 20px; line-height: 1.35; color: var(--ink-soft); }

  /* bigger tab bar */
  .tabfade { height: 96px; }
  .tabbar { height: 76px; bottom: 12px; border-radius: 38px; }
  .tabbar > a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 32px;
                font-size: 17px; font-weight: 700; color: var(--plum); white-space: nowrap; }
  .tabbar > a i[data-icon] { font-size: 26px; }
  .tabbar > a.on { background: var(--plum); color: #fff; }
</style>
<link rel="stylesheet" href="../css/soft.css">
</head>
<body class="soft-home-ax">
<div class="screen">
  <div class="nav">Home<a class="right" href="settings-soft.html" aria-label="Profile and settings"><i data-icon="person-circle"></i></a></div>
  <div class="title-display hdr-title">My Petite Style</div>

  <!-- ============ banner ============ -->
  <div class="banner">
    <!-- wardrobe edge on the left: 1:1, shows its right 70 px (svg x 94..164). Its plain upper face (banner y -20..52)
         stays plain, so the open section starts at banner y 56 -->
    <img class="art" src="../art/wardrobe.svg" alt="" style="left:-94px;top:-46px;width:164px;height:394px">
    <!-- rail at banner y 66, opening x -70..56, y 56..162 (clipped to the banner) -->
    <div class="rail" aria-hidden="true" style="left:0;top:56px;width:56px;height:106px">
      <span class="g" data-garment="g-lace-top" data-hanger style="left:-34px;top:4.5px;width:60px;height:85px"></span>
      <span class="g" data-garment="g-pink-blouse" data-hanger style="left:4px;top:4.5px;width:60px;height:85px"></span>
    </div>
    <!-- window on the right, 1:1; rod at banner y 11, the whole window, sill and lip (to banner y 181.5) sit on the wall -->
    <img class="art" src="../art/window-rain.svg" alt="" style="left:262px;top:5px;width:96px;height:184px">
    <!-- her name sign, name-sign.svg at 1.3 (143 x 83.2), hung on the wall between the wardrobe (to x 70) and the window (from 262).
         Text area x 17..93, y 27..53 becomes x 22.1..120.9, y 35.1..68.9. Tapping it opens Profile. -->
    <a class="sign" href="settings-soft.html" aria-label="Name sign: Lily. Opens Profile" style="left:84px;top:40px;width:143px;height:83.2px">
      <img src="../art/name-sign.svg" alt="">
      <span class="name" style="left:22.1px;top:35.1px;width:98.8px;height:33.8px;font-size:30px">Lily</span>
    </a>
    <!-- weather plate on the window's lower sash (glass y 23.5..166.5), so the rod, curtains and upper glass stay in view.
         It opens the weather sheet in place, as on home.html. -->
    <button class="wxp" type="button" data-wx aria-haspopup="dialog" aria-expanded="false" aria-controls="wx-sheet" aria-label="Weather: 58°F, rain today. Simulated" style="right:6px;top:92px"><span class="t"><i data-icon="rain"></i>58°F<i class="chev" data-icon="chevron-right"></i></span><small>Rain today</small><span class="sim">Simulated</span></button>
  </div>

  <!-- ============ controls as rows ============ -->
  <div class="rows-ax">
    <a class="r" href="suitcases.html">
      <i data-icon="suitcase"></i>
      <span class="txt"><small>Source</small><b>Jose's house</b>
        <span class="pill"><i data-icon="lock"></i>5 pieces · Suitcase only</span></span>
      <span class="end"><i data-icon="chevron-updown"></i></span>
    </a>
    <button class="r butter one" type="button" aria-haspopup="listbox" aria-label="Occasion: Office">
      <i data-icon="calendar"></i>
      <span class="txt"><b>Occasion</b></span>
      <span class="chip on"><i data-icon="check"></i>Office</span>
      <span class="end" style="margin-left:0"><i data-icon="chevron-down"></i></span>
    </button>
    <a class="r pink" href="closet-soft.html">
      <i data-icon="hanger"></i>
      <span class="txt"><small>Starting piece</small><b>Choose a piece</b><span class="hint">e.g. navy dress pants</span></span>
      <span class="end"><i data-icon="chevron-right"></i></span>
    </a>
  </div>

  <a class="btn go" href="results.html"><i data-icon="sparkles"></i>Style Me</a>
  <div class="pair">
    <button class="sec butter" type="button" aria-expanded="false" style="flex:1">More options<i data-icon="chevron-down" style="color:var(--ink)"></i></button>
  </div>

  <!-- ============ weather detail sheet (closed until the weather plate is tapped) ============ -->
  <div class="wxsheet" id="wx-sheet" role="dialog" aria-label="Weather" hidden>
    <div class="wh"><i data-icon="rain"></i><b>Weather</b><span class="sim">Simulated</span>
      <button class="x" type="button" data-wx-close aria-label="Close weather"><i data-icon="close"></i></button></div>
    <p class="big">58°F · Rain today</p>
    <p class="say">Style Me plans for this weather. To plan for other weather, open More options.</p>
  </div>

  <!-- ============ tab bar ============ -->
  <div class="tabfade"></div>
  <nav class="tabbar">
    <a class="on" href="home.html" aria-current="page"><i data-icon="home"></i>Home</a>
    <a href="closet-soft.html"><i data-icon="hanger"></i>Closet</a>
    <a href="saved.html"><i data-icon="bookmark"></i>Saved Looks</a>
  </nav>
</div>

<script src="../js/icons.js"></script>
<script src="../js/garments.js"></script>
<script>
/* Weather sheet: the weather plate opens it; the close button, Escape or a tap outside closes it. */
(function () {
  var sheet = document.getElementById('wx-sheet');
  var openers = document.querySelectorAll('[data-wx]');
  if (!sheet) return;
  function set(open, from) {
    sheet.hidden = !open;
    for (var i = 0; i < openers.length; i++) openers[i].setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) sheet.querySelector('[data-wx-close]').focus(); else if (from) from.focus();
  }
  for (var i = 0; i < openers.length; i++) openers[i].addEventListener('click', function (e) {
    e.stopPropagation(); set(sheet.hidden, this);
  });
  sheet.querySelector('[data-wx-close]').addEventListener('click', function () { set(false, openers[0]); });
  sheet.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!sheet.hidden) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) set(false, openers[0]); });
})();
</script>
</body>
</html>
