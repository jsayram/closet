name: LilyStyleMockup
options:
  bundleIdPrefix: com.example.mypetitestyle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LilyStyleMockup:
    type: application
    platform: iOS
    sources:
      - path: LilyStyleMockup
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mypetitestyle.mockup
        PRODUCT_NAME: LilyStyleMockup
        GENERATE_INFOPLIST_FILE: YES
        # One window only: every window would share the single AppModel's navigation.
        # Config/Info.plist holds the scene manifest, so it isn't generated.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Petite Style Demo"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Optional: take a photo of one garment. Photos stay on this device in the demo."
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
  LilyStyleMockupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LilyStyleMockupUITests
        type: syncedFolder
    dependencies:
      - target: LilyStyleMockup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mypetitestyle.mockup.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LilyStyleMockup
schemes:
  LilyStyleMockup:
    build:
      targets:
        LilyStyleMockup: all
        LilyStyleMockupUITests: [test]
    test:
      targets:
        - LilyStyleMockupUITests
